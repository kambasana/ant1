// â•â•â• EXECUTE TURN â•â•â•
// Committing a turn is irreversible, so idle units get one interception
// before it happens. The first click arms; the second commits.
var execArmed = false;
function executeTurn() {
  if (!orders.length) return;
  var btn = document.getElementById('btn-exec');
  var idle = idleUnits().length;
  if (idle > 0 && !execArmed) {
    execArmed = true;
    btn.classList.add('warn');
    btn.textContent = 'Commit with ' + idle + ' idle?';
    setTimeout(function() {
      if (!execArmed) return;
      execArmed = false; btn.classList.remove('warn'); btn.textContent = 'Execute Turn';
    }, 4000);
    return;
  }
  execArmed = false; btn.classList.remove('warn');
  gamePhase = 'Executing'; updateStatusBar();
  btn.classList.add('executing'); btn.textContent = 'Executing...'; btn.disabled = true;
  setTimeout(function() {
    gameTurn += 1; gamePhase = 'Planning'; updateStatusBar();
    btn.classList.remove('executing'); btn.textContent = 'Execute Turn';
    orders = []; syncQueue();
  }, 1500);
}

// â•â•â• MAP — procedural terrain, full-bleed canvas â•â•â•
var MAP_W = 108, MAP_H = 50;
function _mh(x, y, s) {
  var n = Math.sin(x * 127.1 + y * 311.7 + s * 73.3) * 43758.5453;
  return n - Math.floor(n);
}
function _mn(x, y, sc, s) {
  var sx = x / sc, sy = y / sc;
  var ix = Math.floor(sx), iy = Math.floor(sy);
  var fx = sx - ix, fy = sy - iy;
  fx *= fx * (3 - 2 * fx); fy *= fy * (3 - 2 * fy);
  return (1-fy)*((1-fx)*_mh(ix,iy,s)+fx*_mh(ix+1,iy,s))+fy*((1-fx)*_mh(ix,iy+1,s)+fx*_mh(ix+1,iy+1,s));
}
function _mfbm(x, y, s) {
  return _mn(x,y,18,s)*0.5 + _mn(x,y,8,s+5)*0.3 + _mn(x,y,4,s+10)*0.2;
}

function buildMapMarkers() {
  var markers = [];
  UNITS.forEach(function(u) {
    markers.push({x:u.cell_x, y:u.cell_y, t:'f', k:'u'});
  });
  BUILDINGS.forEach(function(b) {
    markers.push({x:b.cell_x, y:b.cell_y, t:'f', k:'b'});
  });
  ISR_CONTACTS.forEach(function(c) {
    if (c.is_destroyed) return;
    if (c.category === 'building') markers.push({x:c.cell_x, y:c.cell_y, t:'e', k:'b'});
    else markers.push({x:c.cell_x, y:c.cell_y, t:'e', k:'u'});
  });
  return markers;
}

function renderMap() {
  var canvas = document.getElementById('map-canvas');
  var frame = document.getElementById('map-frame');
  if (!canvas || !frame) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = frame.clientWidth, h = frame.clientHeight;
  if (w < 1 || h < 1) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  var cell = Math.max(w / MAP_W, h / MAP_H);
  var ox = (w - MAP_W * cell) / 2, oy = (h - MAP_H * cell) / 2;
  var startCol = Math.floor(-ox / cell) - 1, endCol = Math.ceil((w - ox) / cell) + 1;
  var startRow = Math.floor(-oy / cell) - 1, endRow = Math.ceil((h - oy) / cell) + 1;

  var cs = getComputedStyle(document.documentElement);
  var cAccent = cs.getPropertyValue('--accent').trim() || '#2D72D2';
  var cAccentT = cs.getPropertyValue('--accent-text').trim() || '#8ABBFF';
  var cRed = cs.getPropertyValue('--red').trim() || '#E76A6E';
  var cAmber = cs.getPropertyValue('--amber').trim() || '#EC9A3C';

  for (var row = startRow; row < endRow; row++) {
    for (var col = startCol; col < endCol; col++) {
      var px = ox + col * cell, py = oy + row * cell;
      var inB = col >= 0 && col < MAP_W && row >= 0 && row < MAP_H;
      var ed = inB ? Math.min(col, MAP_W - 1 - col, row, MAP_H - 1 - row) : -1;
      var elev = _mfbm(col, row, 47), moist = _mfbm(col, row, 89);
      var rc = MAP_H * 0.42 + Math.sin(col * 0.055) * 7 + Math.sin(col * 0.14) * 2.5;
      var rd = Math.abs(row - rc), rw = 1.8 + Math.sin(col * 0.03) * 0.6;
      var r, g, b;
      if (!inB) { var v = 11 + elev * 5; r = Math.round(v + 1); g = Math.round(v); b = Math.round(v - 1); }
      // Edge shading is kept to a single cell — a wider falloff darkened
      // six cells on every side and read as dead space rather than terrain.
      else if (ed < 1) { var v = 18 + elev * 6; r = Math.round(v + 2); g = Math.round(v); b = Math.round(v - 1); }
      else if (rd < rw && elev < 0.62) { var d = 1 - rd / rw; r = Math.round(10 + d * 5); g = Math.round(20 + d * 10); b = Math.round(35 + d * 18); }
      else if (elev > 0.68) { var v = 22 + elev * 14; r = Math.round(v + 3); g = Math.round(v + 1); b = Math.round(v - 2); }
      else if (moist > 0.52 && elev > 0.3) { var sh = 0.7 + elev * 0.35; r = Math.round(14 * sh); g = Math.round(26 * sh); b = Math.round(12 * sh); }
      else { var sh = 0.8 + elev * 0.25; r = Math.round(20 * sh); g = Math.round(30 * sh); b = Math.round(16 * sh); }
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(px, py, cell + 1, cell + 1);
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
  for (var gx = 0; gx <= MAP_W; gx += 10) { var lx = ox + gx * cell; ctx.beginPath(); ctx.moveTo(lx, Math.max(0, oy)); ctx.lineTo(lx, Math.min(h, oy + MAP_H * cell)); ctx.stroke(); }
  for (var gy = 0; gy <= MAP_H; gy += 10) { var ly = oy + gy * cell; ctx.beginPath(); ctx.moveTo(Math.max(0, ox), ly); ctx.lineTo(Math.min(w, ox + MAP_W * cell), ly); ctx.stroke(); }

  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  ctx.strokeRect(ox, oy, MAP_W * cell, MAP_H * cell);

  // Both rulers: the feed shouts coordinates, so both axes must resolve.
  var fs = Math.max(8, Math.min(11, cell * 0.7));
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.font = '600 ' + fs + 'px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (var gx = 0; gx < MAP_W; gx += 10) ctx.fillText(gx.toString(), ox + gx * cell + cell / 2, oy + 3);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var ry = Math.max(ox + 4, 4);
  for (var gy = 0; gy < MAP_H; gy += 10) ctx.fillText(gy.toString(), ry, oy + gy * cell + cell / 2 + (gy === 0 ? fs : 0));

  var sz = Math.max(3.5, cell * 0.32);
  var mapMarkers = buildMapMarkers();
  mapMarkers.forEach(function(u) {
    var cx = ox + u.x * cell + cell / 2, cy = oy + u.y * cell + cell / 2;
    ctx.shadowBlur = 0;
    if (u.t === 'f' && u.k === 'u') {
      ctx.shadowColor = cAccentT; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2);
      ctx.fillStyle = cAccent; ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = cAccentT; ctx.lineWidth = 1; ctx.stroke();
    } else if (u.t === 'f' && u.k === 'b') {
      ctx.shadowColor = cAccentT; ctx.shadowBlur = 4;
      ctx.fillStyle = cAccent; ctx.fillRect(cx - sz, cy - sz, sz * 2, sz * 2);
      ctx.shadowBlur = 0; ctx.strokeStyle = cAccentT; ctx.lineWidth = 1;
      ctx.strokeRect(cx - sz, cy - sz, sz * 2, sz * 2);
    } else if (u.t === 'e' && u.k === 'u') {
      ctx.shadowColor = cRed; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.moveTo(cx, cy - sz); ctx.lineTo(cx + sz, cy);
      ctx.lineTo(cx, cy + sz); ctx.lineTo(cx - sz, cy); ctx.closePath();
      ctx.fillStyle = cRed; ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#FF9194'; ctx.lineWidth = 1; ctx.stroke();
    } else if (u.t === 'e' && u.k === 'b') {
      ctx.shadowColor = cRed; ctx.shadowBlur = 4;
      ctx.fillStyle = '#CD4246'; ctx.fillRect(cx - sz, cy - sz, sz * 2, sz * 2);
      ctx.shadowBlur = 0; ctx.strokeStyle = cRed; ctx.lineWidth = 1;
      ctx.strokeRect(cx - sz, cy - sz, sz * 2, sz * 2);
    }
  });
  ctx.shadowBlur = 0;

  // Focus ring for a cell arrived at from the feed.
  if (focusedCell) {
    var fx = ox + focusedCell.x * cell + cell / 2, fy = oy + focusedCell.y * cell + cell / 2;
    ctx.strokeStyle = cAccentT; ctx.lineWidth = 1.5;
    ctx.shadowColor = cAccentT; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(fx, fy, Math.max(10, cell * 1.1), 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(fx - cell * 2, fy); ctx.lineTo(fx - cell * 1.3, fy);
    ctx.moveTo(fx + cell * 1.3, fy); ctx.lineTo(fx + cell * 2, fy);
    ctx.moveTo(fx, fy - cell * 2); ctx.lineTo(fx, fy - cell * 1.3);
    ctx.moveTo(fx, fy + cell * 1.3); ctx.lineTo(fx, fy + cell * 2);
    ctx.stroke();
  }
}
window.addEventListener('resize', function() { renderMap(); });

// â•â•â• PIN / AUTO-HIDE â•â•â•
// Pinned panels stay put. Unpinned ones behave like an auto-hiding tool
// window: they fall shut when the pointer leaves and reopen on a rail
// hover, so the rail alone is enough to work the panel.
function togglePin(id) {

  d.querySelector('.dock-pin').title = pinned ? 'Unpin to auto-hide' : 'Pin open';
  showToast(pinned ? 'Panel pinned' : 'Panel auto-hides');
}
// A dock opened from the keyboard or a jump button has never been
// entered, so mouseleave alone would never fire and it would sit open
// forever. Arm a one-shot watch instead: the first pointer move that is
// confirmed outside the dock shuts it, and entering the dock disarms it
// so the normal mouseleave rule takes over.
var AUTOHIDE_GRACE = 500;   // ms of pointer-outside before an armed dock shuts
function armAutoHide(d) {
  if (!d.classList.contains('unpinned') || d.classList.contains('collapsed')) return;
  if (d._autoHideArmed) return;
  var timer = null;
  var onMove = function(e) {
    var r = d.getBoundingClientRect();
    var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside) { disarm(); return; }   // pointer arrived — mouseleave owns it now
    if (timer) return;                  // already counting down
    timer = setTimeout(function() {
      disarm();
      if (d.classList.contains('unpinned') && !d.classList.contains('collapsed')) toggleDock(d.id);
    }, AUTOHIDE_GRACE);
  };
  var disarm = function() {
    clearTimeout(timer); timer = null;
    d._autoHideArmed = false; d._autoHideDisarm = null;
    document.removeEventListener('mousemove', onMove, true);
  };
  d._autoHideArmed = true;
  d._autoHideDisarm = disarm;
  document.addEventListener('mousemove', onMove, true);
}
['panel-contacts', 'panel-context'].forEach(function(id) {
  var d = document.getElementById(id);
  d.addEventListener('mouseleave', function() {
    if (d._autoHideDisarm) d._autoHideDisarm();
    if (d.classList.contains('unpinned') && !d.classList.contains('collapsed')) toggleDock(id);
  });
  d.querySelector('.dock-rail').addEventListener('mouseenter', function() {
    if (d.classList.contains('unpinned') && d.classList.contains('collapsed')) toggleDock(id);
  });
});


// â•â•â• SETTINGS â•â•â•
// The panel is generated from the config schema, so a setting added to
// DEFAULTS appears here with the right control and no UI work.
var capturingKey = false;
function setCfg(group, key, value) {
  var f = CONFIG[group][key];
  if (!f.key) {
    value = parseFloat(value);
    if (isNaN(value)) return;
    value = Math.max(f.min, Math.min(f.max, value));
  }
  f.v = value;
  applyConfig(); saveConfig(); renderSettings(); refreshKeyHints();
  renderUnits(); renderAlerts(); renderContacts(); renderBuildView(); renderProduction(); updateStatusBar();
}
function captureKey(id, btn) {
  if (capturingKey) return;
  capturingKey = true;
  btn.classList.add('capturing'); btn.textContent = 'press a key';
  function done(e) {
    e.preventDefault(); e.stopPropagation();
    window.removeEventListener('keydown', done, true);
    capturingKey = false; btn.classList.remove('capturing');
    if (e.key !== 'Tab') {
      // A key can only drive one action, so clear any previous holder.
      Object.keys(CONFIG.keys).forEach(function(other) {
        if (other !== id && CONFIG.keys[other].v.toLowerCase() === e.key.toLowerCase()) CONFIG.keys[other].v = '';
      });
      CONFIG.keys[id].v = e.key;
    }
    setCfg('keys', id, CONFIG.keys[id].v);
  }
  window.addEventListener('keydown', done, true);
}
var SETTING_GROUPS = [
  {key:'keys',       label:'Keyboard',   note:'click a key to rebind'},
  {key:'layout',     label:'Layout',     note:'pixels'},
  {key:'density',    label:'Density',    note:''},
  {key:'thresholds', label:'Alert thresholds', note:'when a panel starts warning you'},
];
function renderSettings() {
  var el = document.getElementById('settings-body');
  if (!el) return;
  var html = '';
  SETTING_GROUPS.forEach(function(g) {
    html += '<div class="grp-label sticky">' + g.label +
      (g.note ? '<span class="grp-note">' + g.note + '</span>' : '') + '</div>';
    Object.keys(CONFIG[g.key]).forEach(function(k) {
      var f = CONFIG[g.key][k];
      html += '<div class="set-row"><span class="set-label">' + f.label + '</span>';
      if (f.key) {
        html += '<button class="set-key" onclick="captureKey(\'' + k + '\', this)">' +
          (f.v || 'unbound') + '</button>';
      } else {
        html += '<input class="set-num" type="number" value="' + f.v + '" min="' + f.min +
          '" max="' + f.max + '" step="' + f.step + '" ' +
          'onchange="setCfg(\'' + g.key + '\',\'' + k + '\',this.value)">' +
          '<span class="set-unit">' + f.unit + '</span>';
      }
      html += '</div>';
    });
  });
  html += '<div class="set-actions"><button onclick="resetConfig()">Reset all to defaults</button></div>';
  el.innerHTML = html;
}

// â•â•â• KEYBOARD â•â•â•
// A tool this dense should be drivable from the keyboard. Hints live in
// the segment tooltips and the command-bar hint line.
function runAction(id) {
  for (var i = 0; i < ACTIONS.length; i++) if (ACTIONS[i].id === id) return ACTIONS[i].run();
}
document.addEventListener('keydown', function(e) {
  if (e.target.matches('input, select, textarea')) return;
  if (e.ctrlKey || e.metaKey || e.altKey || capturingKey) return;
  var hit = null;
  Object.keys(CONFIG.keys).forEach(function(id) {
    var k = CONFIG.keys[id].v;
    if (k && (k === e.key || k.toLowerCase() === e.key.toLowerCase())) hit = id;
  });
  if (hit) { e.preventDefault(); runAction(hit); }
});
// Hints name whatever key is bound right now, not a baked-in letter.
var TAB_ACTION = {'left/units':'panel.units', 'left/build':'panel.build', 'left/orders':'panel.orders',
  'left/production':'panel.production', 'left/cap':'panel.capacity', 'right/alerts':'panel.alerts',
  'right/force':'panel.force', 'right/intel':'panel.intel', 'right/settings':'panel.settings'};
function refreshKeyHints() {
  document.querySelectorAll('.rail-btn[data-group][data-tab]').forEach(function(el) {
    var id = TAB_ACTION[el.dataset.group + '/' + el.dataset.tab];
    var it = menuItem(el.dataset.group, el.dataset.tab);
    if (!id || !it || !CONFIG.keys[id]) return;
    el.title = (it.title || it.label) + '  (' + (CONFIG.keys[id].v || 'unbound') + ')';
  });
  var ex = document.getElementById('btn-exec');
  if (ex) ex.title = 'Commit this turn  (' + (CONFIG.keys['turn.execute'].v || 'unbound') + ')';
  var hint = document.getElementById('cmd-hint');
  if (!hint) return;
  // An unbound action must not render an empty key chip — the chip has a
  // border, so an empty one paints a stray box naming nothing.
  var k = function(id) {
    var v = CONFIG.keys[id].v;
    return v ? '<b>' + v + '</b>' : '<i class="key-unbound">unbound</i>';
  };
  hint.innerHTML = 'Panels ' + ACTIONS.slice(0, 9).map(function(a) { return k(a.id); }).join('') +
    ' &middot; ' + k('sel.idle') + ' idle &middot; ' + k('sel.all') + ' all &middot; ' +
    k('sel.none') + ' clear &middot; ' + k('turn.execute') + ' commit';
}

// â•â•â• LIVE FEED â•â•â•
// Everything above runs on the sample data declared at the top of this file.
// When a game is running with --dashboard, it publishes its observation each
// turn and this replaces those arrays with the real thing. Until then the
// sample data stands in, so the page is never blank.
//
// The game publishes rather than the page connecting, because the OpenRA-RL
// server accepts one session and the running game already holds it.
// What each building type produces, by definition. Mirrors PRODUCED_BY in
// milsim/commander.py; used when the live feed leaves can_produce empty.
var PRODUCES_BY_TYPE = {
  fact: ['powr','apwr','barr','tent','proc','weap','dome','fix','hpad','afld',
         'atek','stek','gun','ftur','sam','tsla'],
  barr: ['e1','e2','e3','e4','e6','dog','medi','shok','e7','spy'],
  tent: ['e1','e2','e3','e4','e6','dog','medi','shok','e7','spy'],
  weap: ['1tnk','2tnk','3tnk','4tnk','ttnk','arty','v2rl','jeep','apc','harv','mcv','mnly'],
  hpad: ['heli','hind'],
  afld: ['mig','yak'],
};

var LIVE = {
  url: 'http://127.0.0.1:8321/state',
  ms: 1000,
  connected: false,
  turn: -1,
  misses: 0,
  everLive: false,
};

function setLiveBadge(state, detail) {
  var el = document.getElementById('live-badge');
  if (!el) return;
  el.className = 'live-badge ' + state;
  el.textContent = detail;
}

function applyLive(s) {
  if (!s || !s.connected) return false;

  UNITS = (s.units || []).map(function(u) {
    return {
      actor_id: u.actor_id, type: u.type, cell_x: u.cell_x, cell_y: u.cell_y,
      hp_percent: u.hp_percent, is_idle: u.is_idle,
      current_activity: u.current_activity, stance: u.stance,
      can_attack: u.can_attack, experience_level: u.experience_level,
      speed: 0, attack_range: 0, facing: 0,
    };
  });
  BUILDINGS = (s.buildings || []).map(function(b) {
    // The server reports can_produce empty for every building, including the
    // construction yard and barracks. Left as-is that empties the Facilities
    // list and shows the whole catalogue as locked, so fall back to what the
    // building type produces by definition.
    var produces = (b.can_produce && b.can_produce.length)
      ? b.can_produce
      : (PRODUCES_BY_TYPE[b.type] || []);
    return {
      actor_id: b.actor_id, type: b.type, cell_x: b.cell_x, cell_y: b.cell_y,
      hp_percent: b.hp_percent, is_producing: b.is_producing,
      production_progress: b.production_progress, producing_item: b.producing_item,
      is_powered: b.is_powered, power_amount: b.power_amount,
      can_produce: produces,
    };
  });
  if (s.economy) ECONOMY = s.economy;
  if (s.military) MILITARY = s.military;
  ACTIVE_PRODUCTION = s.production || [];

  // Visible enemies become ISR contacts. The engine only reports what is
  // currently in sight, so anything previously seen and now out of sight is
  // simply absent -- the decay model in the mock data has no live equivalent.
  var enemies = (s.enemies || []).concat(s.enemy_buildings || []);
  ISR_CONTACTS = enemies.map(function(e, i) {
    return {
      contact_id: 'C-' + String(i + 1).padStart(3, '0'),
      actor_id: e.actor_id, intel_level: 4,
      cell_x: e.cell_x, cell_y: e.cell_y,
      category: e.can_produce ? 'building' : (UNIT_DB[e.type] ? UNIT_DB[e.type].queue.toLowerCase() : 'unknown'),
      unit_type: e.type, hp_percent: e.hp_percent, stance: e.stance || 0,
      is_visible: true, turns_since_seen: 0,
      first_seen_turn: s.turn, last_seen_turn: s.turn, turns_observed: 1,
      is_destroyed: false, can_attack: !!e.can_attack,
      speed: 0, attack_range: 0, current_activity: e.current_activity || '',
    };
  });

  if (s.map && s.map.width) { MAP_W = s.map.width; MAP_H = s.map.height; }

  gameTurn = s.turn || 0;
  return true;
}

function renderAll() {
  renderMap(); renderUnits(); renderAlerts(); renderForce();
  renderContacts(); renderCNN(); renderBuildView(); renderProduction();
  renderFeed(); syncQueue(); updateStatusBar(); updateIndicators();
}

function ctl(id) { return document.getElementById(id); }

function setControls(status, s) {
  var running = status === 'running';
  ctl('ctl-start').disabled = running;
  ctl('ctl-stop').disabled = !running;
  ctl('ctl-mode').disabled = running;
  ctl('ctl-model').disabled = running;

  var note = '';
  if (running) {
    var secs = s.elapsed_s || 0;
    note = ((s.config && s.config.mode) || '?') + ' · ' +
      Math.floor(secs / 60) + 'm' + String(secs % 60).padStart(2, '0') + 's';
    if (!s.connected) note += ' · starting';
  } else if (status === 'ended') {
    note = 'finished at T' + (s.turn || 0);
  } else if (status === 'stopped') {
    note = 'stopped at T' + (s.turn || 0);
  } else if (s && s.error) {
    note = s.error;
  }
  ctl('ctl-note').textContent = note;
}

// One request drives the badge, the controls and the panels. Status comes
// from the control server, which outlives any single game, so "no game
// running" is a state the page can show and act on rather than a dead
// connection it has to guess about.
function pollLive() {
  fetch(LIVE.url, {cache: 'no-store'})
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(s) {
      if (!s) throw new Error('no payload');
      LIVE.misses = 0;
      setControls(s.status, s);

      if (s.status === 'running' && s.connected) {
        LIVE.everLive = true;
        var first = !LIVE.connected;
        LIVE.connected = true;
        if (s.turn !== LIVE.turn || first) {
          LIVE.turn = s.turn;
          if (applyLive(s)) renderAll();
        }
        setLiveBadge('on', 'LIVE T' + s.turn);
        return;
      }

      LIVE.connected = false;
      if (s.status === 'running') {
        setLiveBadge('waiting', 'STARTING');
      } else if (s.has_state && (s.status === 'ended' || s.status === 'stopped')) {
        // Keep the real final state on screen. Reverting to sample data would
        // replace a finished game with fiction, which is what made an ended
        // run look like a broken dashboard.
        if (s.turn !== LIVE.turn) { LIVE.turn = s.turn; if (applyLive(s)) renderAll(); }
        setLiveBadge('off', (s.status === 'ended' ? 'ENDED' : 'STOPPED') + ' · T' + s.turn);
      } else {
        setLiveBadge('waiting', 'NO GAME — press New Game');
      }
    })
    .catch(function() {
      LIVE.misses++;
      LIVE.connected = false;
      setControls('idle', {});
      ctl('ctl-note').textContent = 'start it with: python -m milsim.control';
      setLiveBadge('bad', LIVE.misses > 2 ? 'NO CONTROL SERVER' : 'connecting');
    });
}

function postControl(body, label) {
  ctl('ctl-note').textContent = label + '...';
  fetch(LIVE.url.replace('/state', '/control'), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) { ctl('ctl-note').textContent = res.error || 'failed'; return; }
      showToast(label + ' ok');
      pollLive();
    })
    .catch(function() {
      ctl('ctl-note').textContent = 'control server not reachable';
    });
}

function startGame() {
  // A new game is a new world; drop the previous one's numbers rather than
  // letting them linger on screen while the next one spins up.
  LIVE.turn = -1;
  postControl({
    action: 'start',
    mode: ctl('ctl-mode').value,
    model: ctl('ctl-model').value.trim(),
    provider: 'ollama',
    turns: 2000,
  }, 'Starting game');
}

function stopGame() { postControl({action: 'stop'}, 'Stopping game'); }

// â•â•â• INIT â•â•â•
loadConfig(); mountMenus(); applyConfig(); renderSettings(); refreshKeyHints();
renderAll();
setLiveBadge('off', 'connecting');
pollLive();
setInterval(pollLive, LIVE.ms);
</script>
