<meta charset="utf-8">
<title>MilSim C2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #111418;
  --surface: #1C2127;
  --raised: #252A31;
  --elevated: #2F343C;
  --border: #383E47;
  --border-subtle: #21262D;
  --accent: #2D72D2;
  --accent-hover: #4C90F0;
  --accent-soft: rgba(45,114,210,0.12);
  --accent-text: #8ABBFF;
  --green: #32A467;
  --green-soft: rgba(50,164,103,0.08);
  --green-dim: #132A1E;
  --amber: #EC9A3C;
  --amber-soft: rgba(236,154,60,0.08);
  --amber-dim: #2A2014;
  --red: #E76A6E;
  --red-soft: rgba(231,106,110,0.06);
  --red-dim: #2A1518;
  --t1: #F6F7F9;
  --t2: #ABB3BF;
  --t3: #8F99A8;
  --mono: 'IBM Plex Mono', 'SF Mono', 'Consolas', monospace;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --r: 4px;
  --r-lg: 8px;
  --status-h: 36px;
  --cmd-h: 44px;
  --dock-hdr: 32px; --rail-w: 36px; --row-h: 32px; --build-row-h: 26px; --seg-grow: 1.15;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-decel: cubic-bezier(0, 0, 0.2, 1);
  --ease-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-back: cubic-bezier(0.34, 1.3, 0.7, 1);
  /* Selected-segment surface. Dark themes raise it by getting lighter,
     light themes by going white with a lift — so "selected" reads the
     same way in both. */
  --seg-on: var(--elevated);
  --seg-on-shadow: none;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F7F9; --surface: #FFFFFF; --raised: #EDEFF2; --elevated: #E5E8EB;
    --border: #D3D8DE; --border-subtle: #DCE0E5;
    --accent: #2D72D2; --accent-hover: #215DB0; --accent-soft: rgba(45,114,210,0.08); --accent-text: #2D72D2;
    --green: #238551; --green-soft: rgba(35,133,81,0.06); --green-dim: #E8F5EE;
    --amber: #9E5C0D; --amber-soft: rgba(158,92,13,0.07); --amber-dim: #FDF3E6;
    --red: #CD4246; --red-soft: rgba(205,66,70,0.04); --red-dim: #FDECEC;
    --t1: #1C2127; --t2: #5F6B7C; --t3: #5F6B7C;
    --seg-on: var(--surface); --seg-on-shadow: 0 1px 2px rgba(16,22,26,0.18);
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1C2127; --raised: #252A31; --elevated: #2F343C;
  --border: #383E47; --border-subtle: #21262D;
  --accent: #2D72D2; --accent-hover: #4C90F0; --accent-soft: rgba(45,114,210,0.12); --accent-text: #8ABBFF;
  --green: #32A467; --green-soft: rgba(50,164,103,0.08); --green-dim: #132A1E;
  --amber: #EC9A3C; --amber-soft: rgba(236,154,60,0.08); --amber-dim: #2A2014;
  --red: #E76A6E; --red-soft: rgba(231,106,110,0.06); --red-dim: #2A1518;
  --t1: #F6F7F9; --t2: #ABB3BF; --t3: #8F99A8;
  --seg-on: var(--elevated); --seg-on-shadow: none;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--t1);
  font-size: 13px; line-height: 1.5; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum", "cv02", "cv03", "cv04";
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* â•â•â• STATUS BAR â•â•â• */
.status-bar {
  height: var(--status-h); background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0; z-index: 10;
}
.sb-brand { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.sb-sep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }
.sb-spacer { flex: 1; min-width: 8px; }
/* Whether the panels are showing a real game or the built-in sample data is
   the first thing a reader needs to know, so it sits beside the brand. */
.live-badge {
  font-family: var(--mono); font-size: 8px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 100px; white-space: nowrap;
  border: 1px solid transparent;
}
.live-badge.on { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.live-badge.waiting { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
.live-badge.off { background: var(--elevated); color: var(--t3); }
.live-badge.bad { background: var(--red-soft); color: var(--red); border-color: var(--red); }

/* Game controls. Starting and stopping a run is the one thing the dashboard
   could not do, which made every ended game look like a broken page. */
.game-ctl { display: flex; align-items: center; gap: 4px; }
.game-ctl select, .game-ctl input {
  height: 22px; padding: 0 5px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--bg); color: var(--t1);
  font-family: var(--mono); font-size: 10px; outline: none;
}
.game-ctl input { width: 92px; }
.game-ctl select:focus, .game-ctl input:focus { border-color: var(--accent); }
.ctl-btn {
  height: 22px; padding: 0 10px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--border); background: var(--raised); color: var(--t1);
  font-family: var(--sans); font-size: 10px; font-weight: 600; white-space: nowrap;
}
.ctl-btn.go { border-color: var(--accent); color: var(--accent-text); }
.ctl-btn.go:hover:not(:disabled) { background: var(--accent); color: #fff; }
.ctl-btn.stop:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
.ctl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.ctl-note { font-family: var(--mono); font-size: 9px; color: var(--t3); white-space: nowrap; }

/* â•â•â• WORKSPACE — Dock panel grid â•â•â• */
.workspace {
  flex: 1; display: grid; overflow: hidden;
  grid-template-columns: 268px 1fr 332px;
  grid-template-rows: 1fr 210px;
  grid-template-areas: "left map right" "left feed feed";
}

/* â•â•â• DOCK PANELS â•â•â• */
.dock { display: flex; overflow: hidden; background: var(--surface); }
.dock-left { flex-direction: row; }
.dock-right { flex-direction: row-reverse; }
.dock-bottom { flex-direction: column; }
.dock-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
/* Collapsing hides the content, never the menu */
.dock-left.collapsed .dock-main, .dock-right.collapsed .dock-main { display: none; }
.dock-bottom.collapsed .dock-body { display: none; }
.dock-hdr {
  height: var(--dock-hdr); min-height: var(--dock-hdr);
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; background: var(--raised);
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; flex-shrink: 0;
}
.dock-hdr svg { width: 13px; height: 13px; color: var(--t3); flex-shrink: 0; }
.dock-title {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--t3); flex: 1;
}
.dock-badge {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  padding: 1px 5px; border-radius: 100px;
  background: var(--accent-soft); color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.dock-badge.empty { background: var(--elevated); color: var(--t3); }
.dock-chevron { transition: transform 200ms var(--ease-decel); }
.dock.collapsed .dock-chevron { transform: rotate(-90deg); }


/* Pin control — the only chrome left in the header now that the rail
   owns navigation and open/closed. */
.dock-pin {
  width: 20px; height: 20px; flex-shrink: 0;
  border: none; border-radius: 3px; background: transparent;
  color: var(--accent-text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.dock-pin::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 0 2px var(--accent-soft);
}
.dock.unpinned .dock-pin { color: var(--t3); }
.dock.unpinned .dock-pin::before { background: transparent; border: 1.5px solid currentColor; box-shadow: none; }
.dock-pin:hover { background: var(--elevated); }
.dock-pin:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

/* Settings rows — label, control, unit */
.set-row {
  display: grid; grid-template-columns: minmax(0,1fr) 72px 22px;
  gap: 6px; align-items: center; padding: 4px 10px; min-height: 28px;
  border-bottom: 1px solid var(--border-subtle); font-size: 10px;
}
.set-label { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-num, .set-key {
  width: 100%; padding: 3px 6px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--bg); color: var(--t1);
  font-family: var(--mono); font-size: 10px; outline: none; text-align: center;
}
.set-num:focus, .set-key:focus-visible { border-color: var(--accent); }
.set-key { cursor: pointer; }
.set-key:hover { border-color: var(--t3); background: var(--raised); }
.set-key.capturing { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.set-unit { font-family: var(--mono); font-size: 8px; color: var(--t3); }
.set-actions { padding: 10px; }
.set-actions button {
  width: 100%; padding: 6px; border-radius: var(--r);
  border: 1px solid var(--border); background: transparent; color: var(--t2);
  font-family: var(--sans); font-size: 10px; cursor: pointer;
}
.set-actions button:hover { border-color: var(--red); color: var(--red); }
/* Settings sits at the foot of the rail, as tool palettes conventionally do */
.rail-btn.rail-end { margin-top: auto; }

/* â•â•â• DESIGN SYSTEM: Icon Rail â•â•â•
 * What a segmented menu becomes when its panel is collapsed. Same tab
 * contract (data-group / data-tab), same selected treatment turned
 * ninety degrees — raised surface plus an accent bar on the leading
 * edge. Clicking a rail icon reopens the panel on that tab, so a
 * collapsed dock stays navigable instead of becoming a dead strip.
 */
.dock-left .dock-rail, .dock-right .dock-rail {
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px 0; width: var(--rail-w); flex-shrink: 0;
  background: var(--raised);
}
.dock-left .dock-rail { border-right: 1px solid var(--border); }
.dock-right .dock-rail { border-left: 1px solid var(--border); }
.dock-bottom .dock-rail { display: none; }
.dock-bottom.collapsed .dock-rail { display: flex; align-items: center; padding: 0 4px; }
.rail-btn, .rail-expand {
  position: relative; width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--r); background: transparent;
  color: var(--t3); cursor: pointer;
  transition: background 100ms var(--ease-decel), color 100ms var(--ease-decel);
}
.rail-btn svg, .rail-expand svg { width: 15px; height: 15px; }
.rail-btn:hover, .rail-expand:hover { color: var(--t1); background: var(--elevated); }
.rail-btn:focus-visible, .rail-expand:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rail-btn.active {
  background: var(--seg-on); color: var(--t1);
  box-shadow: inset 2px 0 0 var(--accent), var(--seg-on-shadow);
}
.dock-right .rail-btn.active { box-shadow: inset -2px 0 0 var(--accent), var(--seg-on-shadow); }
.dock-bottom .rail-btn.active { box-shadow: inset 0 -2px 0 var(--accent), var(--seg-on-shadow); }
.rail-expand { color: var(--t2); margin-bottom: 2px; }
/* Count rides the icon as a corner badge — the same information the
   segment carries inline, in the space a 28px button has. */
.rail-ct {
  position: absolute; top: 1px; right: 1px;
  min-width: 13px; height: 11px; padding: 0 2px;
  border-radius: 100px; background: var(--elevated); color: var(--t2);
  font-family: var(--mono); font-size: 7px; font-weight: 600; line-height: 11px;
  text-align: center; font-variant-numeric: tabular-nums;
}
.rail-ct.attn { background: var(--accent); color: #fff; }
.rail-ct.empty { display: none; }
.dock-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* Panel positions */
.dock-left { grid-area: left; border-right: 1px solid var(--border); }
.dock-right { grid-area: right; border-left: 1px solid var(--border); }
.dock-bottom { grid-area: feed; border-top: 1px solid var(--border); }
.map-center { grid-area: map; position: relative; overflow: hidden; background: var(--bg); }

/* â•â•â• SEARCH INPUT (reused in panels) â•â•â• */
.dock-search {
  padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.dock-search input {
  width: 100%; padding: 5px 8px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--t1); font-family: var(--sans); font-size: 11px; outline: none;
}
.dock-search input:focus { border-color: var(--accent); }
.dock-search input::placeholder { color: var(--t3); }

/* â•â•â• MAP â•â•â• */
#map-canvas { width: 100%; height: 100%; display: block; }
.map-legend {
  position: absolute; bottom: 8px; left: 8px; z-index: 2;
  display: flex; gap: 14px;
  background: rgba(17,20,24,0.78); padding: 5px 12px;
  border-radius: var(--r); border: 1px solid rgba(56,62,71,0.3);
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #C5CBD3; letter-spacing: 0.02em; white-space: nowrap; }
.legend-item svg { width: 11px; height: 11px; stroke-width: 1; flex-shrink: 0; }
.legend-sw { width: 9px; height: 9px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.12); flex-shrink: 0; }
.legend-sep { width: 1px; height: 12px; background: rgba(255,255,255,0.14); }

/* â•â•â• LEFT PANEL: CONTACTS â•â•â• */
.filter-bar {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 4px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.filter-bar.compact { gap: 3px; }
.filter-bar.compact .filter-chip { padding: 4px 7px; }
.filter-chip {
  min-height: 24px; padding: 4px 9px; border-radius: 100px;
  border: 1px solid var(--border); background: transparent;
  color: var(--t2); font-family: var(--sans); font-size: 10px; cursor: pointer;
  transition: border-color 100ms var(--ease-decel), color 100ms var(--ease-decel), transform 80ms var(--ease-decel);
}
.filter-chip:hover { border-color: var(--t3); color: var(--t1); }
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* â•â•â• CMD BAR ACTIONS — action buttons in bottom command bar â•â•â• */
.cmd-bar-actions {
  display: none; align-items: center; gap: 3px; margin-right: 10px;
}
.cmd-bar-actions.visible { display: flex; }
.sel-count {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--accent-text); margin-right: 4px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.act-btn {
  display: flex; align-items: center; gap: 3px;
  padding: 5px 7px; border-radius: var(--r);
  border: 1px solid transparent; background: transparent;
  color: var(--t1); font-family: var(--sans); font-size: 10px; font-weight: 500; cursor: pointer;
  transition: background 100ms var(--ease-decel), transform 80ms var(--ease-decel); white-space: nowrap;
}
.act-btn:hover { background: var(--raised); }
.act-btn:active { transform: scale(0.93); }
.act-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.act-btn svg { width: 14px; height: 14px; stroke-linecap: round; stroke-linejoin: round; }
.act-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
.act-deselect {
  padding: 4px 7px; border-radius: var(--r);
  border: none; background: transparent; color: var(--t3);
  font-family: var(--sans); font-size: 10px; cursor: pointer;
}
.act-deselect:hover { color: var(--t1); background: var(--raised); }

.cmd-inline-bar {
  display: none; align-items: center; gap: 4px;
}
.cmd-inline-bar.open { display: flex; }
.cmd-inline-bar label { font-size: 9px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; flex-shrink: 0; }
.cmd-inline-bar input, .cmd-inline-bar select {
  padding: 4px 6px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--t1); font-family: var(--mono); font-size: 10px; outline: none; width: 48px;
}
.cmd-inline-bar input:focus { border-color: var(--accent); }
.cmd-inline-bar .cmd-go {
  padding: 4px 12px; border-radius: 3px;
  border: none; background: var(--accent); color: #fff;
  font-family: var(--sans); font-size: 10px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}
.cmd-inline-bar .cmd-go:hover { background: var(--accent-hover); }

/* Unit rows */
.scroll-y { overflow-y: auto; flex: 1; min-height: 0; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.unit-row {
  display: grid; grid-template-columns: 18px 14px minmax(0,1fr) 24px 28px;
  align-items: center; gap: 4px; padding: 4px 8px; height: 30px;
  cursor: pointer; user-select: none;
  transition: background 80ms var(--ease-decel);
  box-shadow: inset 2px 0 0 transparent;
}
.unit-row:hover { background: var(--raised); }
.unit-row.selected { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.unit-check {
  width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: transform 120ms var(--ease-spring), border-color 80ms var(--ease-decel), background 80ms var(--ease-decel);
}
.unit-row:hover .unit-check { border-color: var(--t3); }
.unit-row.selected .unit-check { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.unit-check svg { width: 8px; height: 8px; opacity: 0; color: #fff; } .unit-row.selected .unit-check svg { opacity: 1; }
.unit-icon { display: flex; align-items: center; justify-content: center; color: var(--t3); }
.unit-icon svg { width: 15px; height: 15px; }
.unit-row:hover .unit-icon, .unit-row.selected .unit-icon { color: var(--accent-text); }
.unit-info { min-width: 0; display: flex; align-items: baseline; gap: 4px; }
.unit-name { font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-id { font-family: var(--mono); font-size: 9px; color: var(--t3); flex-shrink: 0; }
.unit-stance { font-size: 9px; color: var(--t3); text-align: right; font-family: var(--mono); }
.unit-hp-bar { width: 36px; height: 2px; border-radius: 1px; background: var(--elevated); overflow: hidden; }
.unit-hp-fill { height: 100%; border-radius: 1px; }
.hp-ok { background: var(--green); } .hp-warn { background: var(--amber); } .hp-crit { background: var(--red); }

/* â•â•â• DESIGN SYSTEM: Modular Toolbar â•â•â•
 * A slot strip for metric modules. Slots wrap and share the width, so a
 * module appended to the driving array simply appears — there is no
 * layout to update and no fixed column count to outgrow.
 * Tone vocabulary shared with the list row: ok / warn / bad.
 * Customise: --mod-min (slot min width), --mod-gap.
 */
.mod-bar {
  --mod-min: 84px; --mod-gap: 3px;
  display: flex; flex-wrap: wrap; gap: var(--mod-gap); padding: 8px;
}
.mod-slot {
  flex: 1 1 var(--mod-min); min-width: var(--mod-min);
  background: var(--bg); border: 1px solid var(--border-subtle);
  border-radius: 3px; padding: 5px 7px;
}
.mod-slot.warn { border-color: var(--amber); background: var(--amber-soft); }
.mod-slot.bad { border-color: var(--red); background: var(--red-soft); }
button.mod-slot { font-family: var(--sans); text-align: left; cursor: pointer; }
button.mod-slot::after { content: ' â€º'; color: var(--t3); font-size: 10px; }
button.mod-slot:hover { border-color: var(--accent); }
button.mod-slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mod-k { display: block; font-size: 8px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; }
.mod-v { font-family: var(--mono); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mod-v.ok { color: var(--green); } .mod-v.warn { color: var(--amber); } .mod-v.bad { color: var(--red); }
.mod-sub { font-family: var(--mono); font-size: 8px; color: var(--t3); margin-left: 4px; }

/* Inline variant — the same modules laid out as a single-line strip,
 * used by the top menu bar. Slots become label/value pairs on one
 * baseline, divided by hairlines instead of boxed. */
.mod-bar.inline { padding: 0; gap: 0; flex-wrap: nowrap; align-items: center; min-width: 0; overflow: hidden; }
.mod-bar.inline .mod-slot {
  flex: 0 1 auto; min-width: 0; border: none; background: transparent;
  border-radius: 0; padding: 0 10px;
  display: flex; align-items: baseline; gap: 5px; white-space: nowrap;
  border-left: 1px solid var(--border);
}
.mod-bar.inline .mod-slot:first-child { border-left: none; padding-left: 0; }
.mod-bar.inline .mod-k { display: inline; font-size: 9px; letter-spacing: 0.03em; }
.mod-bar.inline .mod-v { font-size: 11px; }
.mod-bar.inline .mod-sub { margin-left: 0; }

/* â•â•â• DESIGN SYSTEM: List Row â•â•â•
 * The single row used by every scrolling list — ISR tracks, production
 * queues, facilities. Grid: status pip | body (title + meta) | trailing
 * value, with an optional hairline progress bar on the bottom edge so a
 * row can carry progress without growing into a card.
 * Tone vocabulary shared with the toolbar: ok / warn / bad / dim.
 * Customise: --lrow-h (min height), --lrow-trail (trailing column).
 */
.lrow {
  --lrow-h: var(--row-h); --lrow-trail: 44px;
  position: relative;
  display: grid; grid-template-columns: 8px minmax(0,1fr) var(--lrow-trail);
  gap: 6px; align-items: center;
  min-height: var(--lrow-h); padding: 4px 10px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 10px;
}
.lrow:hover { background: var(--raised); }
.lrow.ico { grid-template-columns: 8px 17px minmax(0,1fr) var(--lrow-trail); }
.lrow-icon { display: flex; align-items: center; justify-content: center; color: var(--t3); }
.lrow-icon svg { width: 16px; height: 16px; }
.lrow:hover .lrow-icon { color: var(--accent-text); }
.lrow-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }
.lrow-pip.ok { background: var(--green); }
.lrow-pip.warn { background: var(--amber); }
.lrow-pip.bad { background: var(--red); }
.lrow-pip.dim { opacity: 0.35; }
.lrow-body { min-width: 0; }
.lrow-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow-meta {
  font-family: var(--mono); font-size: 8px; color: var(--t3);
  display: flex; align-items: center; gap: 5px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
/* A meta line carrying one run of prose truncates like .lrow-title does,
   instead of stopping mid-word. Rows made of several short tokens keep
   clipping at the edge — ellipsising each token would be noise. */
.lrow-meta > span:only-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lrow-meta .warn { color: var(--amber); }
.lrow-tag {
  font-size: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  padding: 0 3px; border-radius: 2px; background: var(--elevated); color: var(--t3); flex-shrink: 0;
}
.lrow-trail { font-family: var(--mono); font-size: 9px; color: var(--t3); text-align: right; font-variant-numeric: tabular-nums; }
.lrow-trail.ok { color: var(--green); }
.lrow-trail.warn { color: var(--amber); }
.lrow-trail.bad { color: var(--red); }
.lrow-prog {
  position: absolute; left: 0; bottom: 0; height: 2px;
  background: var(--green); transition: width 300ms var(--ease-decel);
}
.lrow-prog.warn { background: var(--amber); }
.list-empty { font-size: 10px; color: var(--t3); padding: 12px 10px; }
.contact-filters { display: flex; gap: 3px; padding: 4px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }

/* â•â•â• CNN TARGET ROWS â•â•â• */
.cnn-sub { font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--t3); padding: 5px 0 2px; }
.cnn-row { display: flex; align-items: center; gap: 5px; padding: 2px 0; font-size: 10px; }
.cnn-rank { font-family: var(--mono); font-size: 8px; color: var(--t3); width: 14px; flex-shrink: 0; }
.cnn-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnn-score { font-family: var(--mono); font-size: 9px; font-weight: 600; width: 28px; text-align: right; flex-shrink: 0; }
.cnn-bar { width: 40px; height: 2px; border-radius: 1px; background: var(--elevated); flex-shrink: 0; }
.cnn-fill { height: 100%; border-radius: 1px; }

/* â•â•â• RIGHT PANEL: CONTEXT — collapsible sections â•â•â• */
/* Attention rows are .lrow used as buttons — same anatomy, actionable. */
.att-row {
  width: 100%; background: transparent; color: inherit;
  font-family: var(--sans); text-align: left; cursor: pointer;
  border-left: none; border-right: none; border-top: none;
}
button.att-row:hover { background: var(--accent-soft); }
button.att-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
div.att-row { cursor: default; }

/* Lines of effort — full labels, one bar colour, explicit trend glyph */
.loe-wrap { padding: 4px 10px 10px; }
.loe-row {
  display: grid; grid-template-columns: 76px minmax(0,1fr) 22px 24px;
  gap: 5px; align-items: center; min-height: 18px;
}
.loe-label { font-size: 10px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loe-track { height: 4px; border-radius: 2px; background: var(--elevated); overflow: hidden; }
.loe-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 300ms var(--ease-decel); }
.loe-val { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--t1); text-align: right; font-variant-numeric: tabular-nums; }
.loe-trend { font-family: var(--mono); font-size: 8px; color: var(--t3); text-align: right; }
.loe-trend.up { color: var(--green); } .loe-trend.down { color: var(--red); }

/* Order cards */
.order-card {
  display: flex; align-items: stretch;
  background: var(--raised); border-radius: var(--r);
  border: 1px solid var(--border); margin-bottom: 4px;
  overflow: hidden; min-height: 38px;
  animation: card-in 200ms var(--ease-out-expo) both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(-6px) scale(0.97); } }
.order-card:hover { border-color: var(--elevated); }
.order-stripe { width: 2px; flex-shrink: 0; }
.order-stripe.move { background: var(--accent); } .order-stripe.attack { background: var(--red); }
.order-stripe.defend { background: var(--green); } .order-stripe.scout { background: var(--amber); }
.order-stripe.hold { background: var(--t3); } .order-stripe.build { background: var(--green); }
.order-stripe.guard { background: var(--amber); }
.order-stripe.train { background: var(--accent); } .order-stripe.stance { background: var(--t3); }
.order-body { flex: 1; display: flex; align-items: center; padding: 5px 8px; gap: 6px; min-width: 0; }
.order-badge {
  font-family: var(--mono); font-size: 8px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  padding: 2px 6px; border-radius: 2px; flex-shrink: 0;
}
.order-badge.move { background: var(--accent-soft); color: var(--accent-text); }
.order-badge.attack { background: var(--red-soft); color: var(--red); }
.order-badge.defend { background: var(--green-soft); color: var(--green); }
.order-badge.scout { background: var(--amber-soft); color: var(--amber); }
.order-badge.hold { background: var(--elevated); color: var(--t2); }
.order-badge.guard { background: var(--amber-soft); color: var(--amber); }
.order-badge.build { background: var(--green-soft); color: var(--green); }
.order-badge.train { background: var(--accent-soft); color: var(--accent-text); }
.order-badge.stance { background: var(--elevated); color: var(--t2); }
.order-detail { flex: 1; min-width: 0; }
.order-desc { font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-units { font-family: var(--mono); font-size: 9px; color: var(--t3); }
.order-meta { display: flex; gap: 6px; align-items: center; margin-top: 1px; }
.order-unit-names { font-family: var(--mono); font-size: 9px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-eta { font-family: var(--mono); font-size: 8px; color: var(--t3); padding: 1px 4px; border-radius: 2px; background: var(--elevated); }
.order-rm {
  width: 20px; height: 20px; border-radius: 3px;
  border: none; background: transparent; color: var(--t3);
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  opacity: 0;
}
.order-card:hover .order-rm { opacity: 1; }
.order-rm:hover { background: var(--red-soft); color: var(--red); }
.orders-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--t3); gap: 4px; font-size: 11px; padding: 20px;
}
.orders-empty svg { width: 28px; height: 28px; opacity: 0.15; }
.orders-actions {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.orders-actions button {
  padding: 3px 8px; border-radius: var(--r);
  border: 1px solid var(--border); background: transparent;
  color: var(--t2); font-family: var(--sans); font-size: 10px; cursor: pointer;
}
.orders-actions button:hover { background: var(--raised); color: var(--t1); }

/* â•â•â• BOTTOM PANEL: FEED â•â•â• */
.feed-bar {
  display: flex; align-items: center; gap: 4px;
  padding: 0 10px; flex-shrink: 0;
}
.feed-bar input {
  width: 140px; padding: 4px 8px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--t1); font-family: var(--sans); font-size: 10px; outline: none;
}
.feed-bar input:focus { border-color: var(--accent); }
.feed-bar input::placeholder { color: var(--t3); }
.feed-filter {
  min-height: 24px; padding: 4px 9px; border-radius: 100px;
  border: 1px solid transparent; background: transparent;
  color: var(--t3); font-family: var(--sans); font-size: 9px; cursor: pointer;
  transition: color 80ms var(--ease-decel), border-color 80ms var(--ease-decel);
}
.feed-filter:hover { color: var(--t2); }
.feed-filter.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.feed-scroll { flex: 1; overflow-y: auto; }
.f-row {
  display: flex; align-items: center; height: 26px;
  padding: 0 10px; border-bottom: 1px solid var(--border-subtle);
  gap: 6px; border-left: 2px solid transparent;
  transition: background 60ms var(--ease-decel);
}
.f-row:hover { background: var(--raised); }
.f-row.critical { border-left-color: var(--red); background: var(--red-soft); }
.f-row.critical:hover { background: var(--red-dim); }
.f-row.warning { border-left-color: var(--amber); }
.f-row.info { border-left-color: var(--accent); }
.f-row.routine { border-left-color: transparent; }
.f-turn { font-family: var(--mono); font-size: 9px; color: var(--t3); width: 20px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.f-tag {
  font-size: 7px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; padding: 1px 4px; border-radius: 2px; flex-shrink: 0; width: 38px; text-align: center;
}
.f-tag.combat { background: var(--red-dim); color: var(--red); }
.f-tag.recon { background: var(--amber-dim); color: var(--amber); }
.f-tag.prod { background: var(--green-dim); color: var(--green); }
.f-tag.move { background: var(--accent-soft); color: var(--accent-text); }
.f-tag.system { background: var(--elevated); color: var(--t3); }
.f-msg { flex: 1; font-size: 11px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Coordinates the log mentions are links to that cell */
.f-coord {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--accent-text); background: var(--accent-soft);
  border: 1px solid transparent; border-radius: 3px;
  padding: 1px 5px; margin: 0 1px; cursor: pointer;
}
.f-coord::before { content: '⌖ '; opacity: 0.7; }
.f-coord:hover { border-color: var(--accent); background: var(--raised); }
.f-coord:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.f-hp { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-family: var(--mono); font-size: 9px; color: var(--t3); }
.f-hp-bar { display: inline-block; width: 34px; height: 3px; border-radius: 2px; background: var(--elevated); overflow: hidden; }
.f-hp-fill { display: block; height: 100%; border-radius: 2px; }
.f-row.critical .f-msg { color: var(--red); font-weight: 600; }
.f-row.warning .f-msg { color: var(--amber); font-weight: 500; }
.f-row.info .f-msg { color: var(--t1); }

/* â•â•â• CMD BAR â•â•â• */
.cmd-bar {
  height: var(--cmd-h); background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 10px; flex-shrink: 0; z-index: 10;
}
.cmd-queue-count {
  border: none; background: transparent; cursor: pointer;
  border-radius: var(--r); padding: 4px 8px; min-height: 24px;
  font-family: var(--mono); font-size: 10px; color: var(--t2); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cmd-queue-count:hover { background: var(--raised); color: var(--t1); }
.cmd-queue-count:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.cmd-hint { font-size: 10px; color: var(--t3); }
.cmd-hint b { font-family: var(--mono); font-weight: 600; color: var(--t2); background: var(--raised); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
/* Adjacent key chips need air between their borders, and an action with
   no key says so in words rather than showing an empty chip. */
.cmd-hint b + b, .cmd-hint b + .key-unbound, .cmd-hint .key-unbound + b { margin-left: 2px; }
.cmd-hint .key-unbound { font-style: normal; color: var(--t3); }
.cmd-bar-actions.visible ~ .cmd-hint { display: none; }
.cmd-queue-count .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: none; }
.cmd-queue-count .dot.has-orders { display: block; animation: pulse 1.5s ease infinite; }
.cmd-spacer { flex: 1; }
.btn-execute {
  padding: 8px 24px; border-radius: var(--r-lg);
  border: none; background: var(--accent); color: #fff;
  font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer;
  transition: transform 120ms var(--ease-out-back), opacity 200ms var(--ease-decel), box-shadow 200ms var(--ease-decel);
}
.btn-execute:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 4px 16px rgba(45,114,210,0.3); }
.btn-execute:active { transform: translateY(0) scale(0.97); }
.btn-execute:disabled {
  background: var(--raised); color: var(--t3); border: 1px solid var(--border);
  cursor: not-allowed; transform: none; box-shadow: none;
}
/* Size variant for the top menu bar */
.btn-execute.sm { padding: 6px 16px; border-radius: var(--r); font-size: 11px; min-height: 26px; }
.btn-execute.warn { background: var(--amber); color: #1C2127; }
.btn-execute.warn:hover { background: var(--amber); }
.btn-execute.executing { background: var(--green); animation: exec-pulse 1s var(--ease-standard) infinite; }
@keyframes exec-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Toast */
.toast {
  position: fixed; bottom: calc(var(--cmd-h) + 10px); left: 50%;
  transform: translateX(-50%) translateY(16px) scale(0.95);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 6px 14px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  color: var(--accent-text); box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none; z-index: 100;
  transition: opacity 150ms var(--ease-decel), transform 200ms var(--ease-spring);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
@keyframes badge-pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* â•â•â• DESIGN SYSTEM: Segmented Control â•â•â•
 * Composable tab-switcher component.
 * Usage: .seg-ctrl > .seg-btn[data-tab] > label + optional .seg-ct
 * Indicator: .seg-ct shows inline count suffix.
 * Attention: .seg-ct.attn adds a dot prefix for "needs action" state.
 * Customise: --seg-h (height), --seg-r (radius), --seg-font (size).
 */
.seg-ctrl {
  --seg-h: 24px; --seg-r: 4px; --seg-font: 9px;
  display: flex; height: var(--seg-h); border-radius: var(--seg-r);
  background: var(--bg); border: 1px solid var(--border);
  overflow: hidden; flex-shrink: 0; flex: 1;
}
/* The selected segment is stated three ways at rest, because a static
 * frame has nothing to compare against: it sits on a raised surface,
 * its label jumps to full-contrast text, and an accent bar underlines
 * it. The extra width is a nudge that confirms the click — never the
 * only thing carrying the state. Tune it with --seg-grow. */
.seg-btn {
  flex: 1 1 0; border: none; background: transparent;
  color: var(--t3); font-family: var(--sans); font-size: var(--seg-font); font-weight: 600;
  letter-spacing: 0.03em; cursor: pointer; padding: 0 4px;
  transition: flex-grow 200ms var(--ease-emphasized),
              color 100ms var(--ease-decel), background 100ms var(--ease-decel);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  white-space: nowrap; min-width: 0; overflow: hidden;
}
.seg-btn:hover { color: var(--t2); background: var(--raised); }
.seg-btn.active {
  flex-grow: var(--seg-grow);
  background: var(--seg-on); color: var(--t1);
  box-shadow: inset 0 -2px 0 var(--accent), var(--seg-on-shadow);
}
.seg-btn.active:hover { background: var(--seg-on); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
/* Size variant for nested/second-level menus */
.seg-ctrl.sm { --seg-h: 22px; --seg-font: 8px; }
.seg-ctrl.sm .seg-ct { --ct-dot: 3px; }
/* Row wrapper when a control sits in a panel body rather than a header */
.seg-sub {
  display: flex; padding: 5px 8px; flex-shrink: 0;
  border-bottom: 1px solid var(--border-subtle);
}

/* â•â•â• DESIGN SYSTEM: Inline Count Indicator â•â•â•
 * Composable badge for any tab/segment/header.
 * .seg-ct           — neutral inline count, reduced opacity
 * .seg-ct.attn      — attention state: dot prefix, full opacity, accent tint
 * .seg-ct.empty     — zero state: hidden
 * .seg-ct.bounce    — one-shot pop when the count changes
 * Customise: --ct-font, --ct-dot, --ct-dim, --ct-tone.
 * Works on .seg-btn, .dock-hdr, or standalone.
 */
.seg-ct {
  --ct-font: 7px; --ct-dot: 4px; --ct-dim: 1; --ct-tone: var(--t2);
  font-family: var(--mono); font-size: var(--ct-font); font-weight: 600;
  color: var(--ct-tone); opacity: var(--ct-dim); font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 2px;
  transition: opacity 100ms var(--ease-decel), color 100ms var(--ease-decel);
}
/* On the raised active segment the count would otherwise inherit
   full-contrast white, so pull it back to a supporting weight. */
.seg-btn.active .seg-ct { --ct-tone: var(--t2); }
.seg-ct.attn, .seg-btn.active .seg-ct.attn { --ct-tone: var(--accent-text); opacity: 1; }
.seg-ct.attn::before {
  content: ''; width: var(--ct-dot); height: var(--ct-dot); border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.seg-ct.empty { display: none; }
.seg-ct.bounce { animation: badge-pop 400ms var(--ease-spring); }

/* â•â•â• DESIGN SYSTEM: Tab View Container â•â•â•
 * Generic switchable content panel.
 * .tab-view         — hidden by default
 * .tab-view.active  — visible, fills parent
 */
.tab-view { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }
.tab-view.active { display: flex; }

/* â•â•â• DESIGN SYSTEM: Group Label â•â•â•
 * Section heading used inside any scrolling panel body.
 */
.grp-label {
  font-size: 8px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--t3); margin: 8px 0 4px; padding-bottom: 2px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 5px;
}
.grp-label:first-child { margin-top: 0; }
.ct-pill {
  font-family: var(--mono); font-size: 8px; font-weight: 600;
  padding: 0 4px; border-radius: 100px;
  background: var(--accent-soft); color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.ct-pill.dim { background: var(--elevated); color: var(--t3); }
.grp-note { margin-left: auto; font-family: var(--mono); font-size: 8px; color: var(--t3); text-transform: none; letter-spacing: 0; }

/* Sticky variant — in a long grouped list the heading has to stay
 * visible, otherwise you scroll out of the queue you were reading. */
.grp-label.sticky {
  position: sticky; top: 0; z-index: 1; margin: 0;
  padding: 6px 10px 4px; background: var(--surface);
  border-bottom: 1px solid var(--border-subtle);
}

/* â•â•â• BUILD VIEW — catalog rows â•â•â•
 * A single column, because two columns at this panel width leave ~58px
 * for a name and truncate almost every one of them. Rows are separated
 * by a hairline rather than boxed, which removes 43 borders' worth of
 * visual air, and the role rides each row as a leading code — so the
 * repeated codes form the grouping and no header band is spent on it.
 */
.build-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.build-row {
  display: grid; grid-template-columns: 20px minmax(0,1fr) auto;
  gap: 8px; align-items: center; width: 100%;
  padding: 4px 10px; min-height: var(--build-row-h);
  border: none; border-bottom: 1px solid var(--border-subtle);
  background: transparent; color: var(--t2);
  font-family: var(--sans); font-size: 10px; text-align: left; cursor: pointer;
  transition: background 80ms var(--ease-decel), color 80ms var(--ease-decel);
}
.build-row:hover { background: var(--raised); color: var(--t1); }
.build-row:active { background: var(--accent-soft); }
.build-role { display: flex; align-items: center; justify-content: center; color: var(--t3); }
.build-role svg { width: 16px; height: 16px; }
.filter-chip.icon { padding: 3px 7px; display: flex; align-items: center; }
.filter-chip.icon svg { width: 15px; height: 15px; display: block; }
.build-row:hover .build-role { color: var(--accent-text); }
/* Prerequisite takes the trailing slot on locked rows, so it can never
   push past the panel edge the way an inline note did. */
.build-need {
  font-family: var(--mono); font-size: 8px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--t3); background: var(--elevated); border-radius: 2px; padding: 1px 4px;
}
.build-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.build-cost { font-family: var(--mono); font-size: 9px; color: var(--t3); font-variant-numeric: tabular-nums; }
.build-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.build-cost.warn { color: var(--amber); }
/* Affordable now — the default, most-legible state */
.build-row.ready .build-name { color: var(--t1); }
/* Producible but cost exceeds EconomyInfo.cash */
.build-row.poor .build-cost { color: var(--amber); }
.build-row.poor .build-name { color: var(--t2); }
/* No powered facility can produce it — BuildingInfoModel.can_produce.
   Held above the contrast floor so the reason stays readable. */
.build-row.locked { cursor: not-allowed; }
.build-row.locked .build-name, .build-row.locked .build-cost { color: var(--t3); }
.build-row.locked:hover { background: transparent; }

function cloneCfg(src) {
  var out = {};
  Object.keys(src).forEach(function(g) {
    out[g] = {};
    Object.keys(src[g]).forEach(function(k) {
      out[g][k] = {};
      Object.keys(src[g][k]).forEach(function(f) { out[g][k][f] = src[g][k][f]; });
    });
  });
  return out;
}
var CONFIG = cloneCfg(DEFAULTS);
// Read a setting's value. Everything below calls this, never a literal.
function cfg(group, key) { return CONFIG[group][key].v; }

function saveConfig() {
  try {
    var flat = {};
    Object.keys(CONFIG).forEach(function(g) {
      flat[g] = {};
      Object.keys(CONFIG[g]).forEach(function(k) { flat[g][k] = CONFIG[g][k].v; });
    });
    localStorage.setItem('c2-config', JSON.stringify(flat));
  } catch (e) { /* storage unavailable — settings stay for this session */ }
}
function loadConfig() {
  try {
    var raw = localStorage.getItem('c2-config');
    if (!raw) return;
    var flat = JSON.parse(raw);
    Object.keys(flat).forEach(function(g) {
      if (!CONFIG[g]) return;
      Object.keys(flat[g]).forEach(function(k) {
        if (CONFIG[g][k]) CONFIG[g][k].v = flat[g][k];
      });
    });
  } catch (e) { /* ignore malformed storage */ }
}
function resetConfig() {
  CONFIG = cloneCfg(DEFAULTS);
  applyConfig(); saveConfig(); renderSettings(); refreshKeyHints();
  showToast('Settings reset');
}

// Layout settings become CSS custom properties, so the stylesheet holds
// no fixed dimensions either.
function applyConfig() {
  var r = document.documentElement.style;
  r.setProperty('--rail-w',   cfg('layout','railWidth') + 'px');
  r.setProperty('--dock-hdr', cfg('layout','dockHeader') + 'px');
  r.setProperty('--row-h',    cfg('density','rowHeight') + 'px');
  r.setProperty('--build-row-h', cfg('density','buildRowHeight') + 'px');
  r.setProperty('--seg-grow', cfg('density','segGrow'));
  updateGrid();
  if (typeof renderMap === 'function') setTimeout(renderMap, 30);
}

// â•â•â• DESIGN SYSTEM: indicator primitive â•â•â•
// setIndicator(id, value, attn) — universal count badge writer.
// value 0/null hides the badge; attn raises it to the dot+accent state.
function setIndicator(id, value, attn) {
  var el = document.getElementById(id);
  if (!el) return;
  var n = value || 0;
  el.textContent = n > 99 ? '99+' : String(n);
  el.classList.toggle('empty', n === 0);
  el.classList.toggle('attn', !!attn && n > 0);
  if (n > 99) el.textContent = '99+';
}

// Every badge, in both presentations, from the one declaration.
function updateIndicators() {
  Object.keys(MENUS).forEach(function(group) {
    MENUS[group].items.forEach(function(it) {
      if (!it.count) return;
      var r = it.count() || {};
      setIndicator('ct-' + group + '-' + it.tab, r.n, r.attn);
      setIndicator('rct-' + group + '-' + it.tab, r.n, r.attn);
    });
  });
}

function svgIcon(d) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

// count() returns {n, attn} or nothing at all for items that carry none.
var MENUS = {
  left: {title:'title-left', items: [
    {tab:'units',  label:'Units',  key:'1', icon:ICON.units,
     count:function() { return {n:selected.size || getVisibleUnits().length, attn:selected.size > 0}; }},
    {tab:'build',  label:'Build',  key:'2', icon:ICON.build},
    {tab:'orders', label:'Orders', title:'Orders staged for this turn', key:'3', icon:ICON.orders,
     count:function() { return {n:orders.length, attn:orders.length > 0}; }},
    {tab:'production', label:'Prod', head:'Production', title:'What is being built right now', key:'4', icon:ICON.prod,
     count:function() { return {n:ACTIVE_PRODUCTION.length, attn:idleFacilityCount() > 0}; }},
    {tab:'cap',    label:'Cap',    head:'Capacity', key:'5', title:'Capacity — the means of production', icon:ICON.cap,
     count:function() { var n = alertCount(CAPACITY_MODULES); return {n:n, attn:n > 0}; }},
  ]},
  right: {title:'title-right', items: [
    {tab:'alerts', label:'Alerts', title:'Needs attention', icon:ICON.alerts,
     count:function() {
       var a = attentionItems();
       return {n:a.length, attn:a.some(function(x) { return x.tone === 'bad' || x.tone === 'warn'; })};
     }},
    {tab:'force',  label:'Force',  title:'Standing force and lines of effort', icon:ICON.force},
    {tab:'intel',  label:'Intel',  title:'ISR tracks and tactical analysis', icon:ICON.intel,
     count:function() {
       var c = liveContacts();
       return {n:c.length, attn:c.some(function(x) { return x.is_visible && x.can_attack; })};
     }},
    {tab:'settings', label:'Set', head:'Settings', title:'Settings', icon:ICON.settings},
  ]},
  // Sub-menus use the same component; they simply have no rail.
  intel: {sm:true, items: [
    {tab:'tracks', label:'Tracks', title:'ISR contacts',
     count:function() { var c = liveContacts(); return {n:c.length, attn:c.some(function(x) { return x.is_visible && x.can_attack; })}; }},
    {tab:'cnn',    label:'Analysis', title:'CNN tactical analysis',
     count:function() {
       var h = CNN_DATA.hot_spots.filter(function(x) { return x.score >= cfg('thresholds','hotspotAlert'); });
       return {n:h.length, attn:h.length > 0};
     }},
  ]},
  prod: {sm:true, items: [
    {tab:'fac',    label:'Facilities', title:'Producing structures',

function liveContacts() { return ISR_CONTACTS.filter(function(c) { return !c.is_destroyed; }); }

function menuItem(group, tab) {
  var menu = MENUS[group];
  if (!menu) return null;
  for (var i = 0; i < menu.items.length; i++) {
    if (menu.items[i].tab === tab) return menu.items[i];
  }
  return null;
}
function itemHint(it) {
  return (it.title || it.label) + (it.key ? '  (' + it.key + ')' : '');
}

// Each rail icon and each segment is its own element in the markup,
// carrying only its group and tab. Mounting fills that one element from
// its declaration — nothing writes a rail or a control as a whole. So an
// item can be reordered, moved to another rail, or have separators put
// between it and its neighbours by editing markup alone.
function mountRailItem(el) {
  var it = menuItem(el.dataset.group, el.dataset.tab);
  if (!it) return;
  el.title = itemHint(it);
  el.innerHTML = svgIcon(it.icon) +
    (it.count ? '<span class="rail-ct" id="rct-' + el.dataset.group + '-' + it.tab + '"></span>' : '');
}
function mountSegItem(el) {
  var group = el.closest('.seg-ctrl').dataset.group;
  var it = menuItem(group, el.dataset.tab);
  if (!it) return;
  el.title = itemHint(it);
  el.innerHTML = it.label +
    (it.count ? ' <span class="seg-ct" id="ct-' + group + '-' + it.tab + '"></span>' : '');
}
function mountMenus() {
  document.querySelectorAll('.rail-btn[data-group][data-tab]').forEach(mountRailItem);
  document.querySelectorAll('.seg-ctrl[data-group] .seg-btn[data-tab]').forEach(mountSegItem);
}

// â•â•â• DESIGN SYSTEM: tab group controller â•â•â•
// One controller drives every segmented menu. A group is a .seg-ctrl
// plus the .tab-view elements sharing its data-group; buttons and views
// pair up on data-tab. Adding a menu anywhere is markup only — the
// delegated listener below picks it up with no new JS.
var TAB_HOOKS = {
  left:  function(k) {
    if (k === 'build') renderBuildView();
    if (k === 'production') renderProduction();
    if (k === 'cap') renderCapacity();
  },
  right: function(k) {
    if (k === 'alerts') renderAlerts();
    if (k === 'force') renderForce();
    if (k === 'settings') renderSettings();
  },
  prod:  function() { renderProduction(); },
  intel: function() {},
};
function switchTab(group, key) {
  // A key with no view behind it would deactivate every view and every
  // button in the group, blanking the panel. Refuse instead.
  if (!document.querySelector('.tab-view[data-group="' + group + '"][data-tab="' + key + '"]')) return;
  document.querySelectorAll('.seg-ctrl[data-group="' + group + '"] .seg-btn, .rail-btn[data-group="' + group + '"]')
    .forEach(function(b) { b.classList.toggle('active', b.dataset.tab === key); });
  document.querySelectorAll('.tab-view[data-group="' + group + '"]')
    .forEach(function(v) { v.classList.toggle('active', v.dataset.tab === key); });
  // With no tab strip, the dock header names whatever the rail selected.
  var menu = MENUS[group], it = menuItem(group, key);
  if (menu && menu.title && it) {
    var h = document.getElementById(menu.title);
    if (h) h.textContent = it.head || it.label;
  }
  if (TAB_HOOKS[group]) TAB_HOOKS[group](key);
}
document.addEventListener('click', function(e) {
  // Rail icons carry the same tab contract as segments, and reopen the
  // panel they belong to so a collapsed dock is still navigable.
  var rail = e.target.closest('.rail-btn');
  if (rail) {
    var dock = rail.closest('.dock');
    var wasActive = rail.classList.contains('active');
    var wasOpen = !dock.classList.contains('collapsed');
    switchTab(rail.dataset.group, rail.dataset.tab);
    // Same icon again closes the panel; any other icon opens it there.
    if (wasActive && wasOpen) toggleDock(dock.id);
    else if (!wasOpen) toggleDock(dock.id);
    return;
  }
  var btn = e.target.closest('.seg-btn');
  if (!btn) return;
  var ctrl = btn.closest('.seg-ctrl');
  if (ctrl && ctrl.dataset.group) switchTab(ctrl.dataset.group, btn.dataset.tab);
});

// â•â•â• LEFT PANEL: OWN UNITS â•â•â•
function searchUnits(q) { unitSearch = q.toLowerCase(); renderUnits(); }

function getVisibleUnits() {
  return UNITS.filter(function(u) {
    var cat = unitCategory(u);
    if (unitFilter !== 'all' && cat !== unitFilter) return false;
    if (unitSearch) {
      var n = unitName(u).toLowerCase();
      if (n.indexOf(unitSearch) === -1 && ('#' + u.actor_id).indexOf(unitSearch) === -1 && u.type.indexOf(unitSearch) === -1) return false;
    }
    return true;
  });
}

function renderUnits() {
  var list = document.getElementById('unit-list');
  list.innerHTML = '';
  var visible = getVisibleUnits();
  visible.forEach(function(u, idx) {
    var el = document.createElement('div');
    el.className = 'unit-row' + (selected.has(u.actor_id) ? ' selected' : '');
    var hp = Math.round(u.hp_percent * 100);
    var hpCls = hp > 70 ? 'hp-ok' : hp > 35 ? 'hp-warn' : 'hp-crit';
    var st = u.stance >= 0 && u.stance < STANCES.length ? STANCES[u.stance] : '?';
    el.innerHTML =
      '<div class="unit-icon">' + glyph(ITEM_ICON[u.type]) + '</div>' +
      '<div class="unit-check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-5"/></svg></div>' +
      '<div class="unit-info"><span class="unit-name">' + unitName(u) + '</span><span class="unit-id">#' + u.actor_id + '</span></div>' +
      '<div class="unit-stance">' + st + '</div>' +
      '<div class="unit-hp-bar"><div class="unit-hp-fill ' + hpCls + '" style="width:' + hp + '%"></div></div>';
    el.addEventListener('click', function(e) {
      if (e.shiftKey && lastClickIdx >= 0) {
        var start = Math.min(lastClickIdx, idx), end = Math.max(lastClickIdx, idx);
        for (var i = start; i <= end; i++) selected.add(visible[i].actor_id);
      } else if (e.ctrlKey || e.metaKey) {
        if (selected.has(u.actor_id)) selected.delete(u.actor_id); else selected.add(u.actor_id);
      } else {
        if (selected.has(u.actor_id) && selected.size === 1) selected.delete(u.actor_id);
        else { selected.clear(); selected.add(u.actor_id); }
      }
      lastClickIdx = idx;
      renderUnits(); updateToolbar();
    });
    list.appendChild(el);
  });
  if (!visible.length) list.innerHTML = '<div class="list-empty">No units in this category.</div>';
  updateIndicators();
}

document.querySelectorAll('#units-toolbar .filter-chip').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('#units-toolbar .filter-chip').forEach(function(c) { c.classList.remove('active'); });
    b.classList.add('active');
    unitFilter = b.dataset.f;
    renderUnits();
  };
});

function selectNone() { selected.clear(); lastClickIdx = -1; closeCmd(); renderUnits(); updateToolbar(); }

function updateToolbar() {
  var bar = document.getElementById('cmd-bar-actions');
  var count = document.getElementById('sel-count');
  var hasSelection = selected.size > 0;
  bar.classList.toggle('visible', hasSelection);
  count.textContent = selected.size + ' sel';
  if (!hasSelection) closeCmd();

}

function pickAction(act) {
  activeAct = act;
  document.querySelectorAll('.act-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.act === act); });
  var cmd = document.getElementById('cmd-inline');
  var fields = document.getElementById('cmd-fields');
  if (act === 'stop') { queueStop(); return; }
  if (act === 'stance') {
    fields.innerHTML = '<label>Stance</label><select id="cmd-stance"><option value="0">HoldFire</option><option value="1">ReturnFire</option><option value="2" selected>Defend</option><option value="3">AttackAnything</option></select>';
    cmd.classList.add('open'); return;
  }
  fields.innerHTML = '<label>X</label><input type="number" id="cmd-x" placeholder="X" min="0" max="107"><label>Y</label><input type="number" id="cmd-y" placeholder="Y" min="0" max="49">';
  cmd.classList.add('open');
  var fx = document.getElementById('cmd-x'); if (fx) fx.focus();
}
function closeCmd() {
  document.getElementById('cmd-inline').classList.remove('open');
  document.querySelectorAll('.act-btn').forEach(function(b) { b.classList.remove('active'); });
  activeAct = null;
}
function queueStop() {
  orders.push({type:'stop', units:Array.from(selected)});
  closeCmd(); syncQueue(); showToast('Stop queued'); bounceBadge();
}
function queueFromCmd() {
  if (!activeAct) return;
  if (activeAct === 'stance') {
    var stVal = +document.getElementById('cmd-stance').value;
    orders.push({type:'set_stance', units:Array.from(selected), stance:stVal});
  } else {
    var x = +document.getElementById('cmd-x').value, y = +document.getElementById('cmd-y').value;
    if (x < 0 || y < 0) return;
    var actionMap = {move:'move', attack:'attack_move', defend:'defend', scout:'scout', guard:'guard'};
    orders.push({type:actionMap[activeAct] || activeAct, units:Array.from(selected), target_x:x, target_y:y});
  }
  var act = activeAct;
  closeCmd(); syncQueue();
  showToast(act.charAt(0).toUpperCase() + act.slice(1) + ' queued'); bounceBadge();
}

// â•â•â• DESIGN SYSTEM: modular toolbar renderer â•â•â•
// Renders any array of metric modules. A module is {k, get} where get()
// returns {v, sub, tone} — self-contained, so a new metric is one entry
// in the array and nothing else changes.
function renderModBar(el, modules, variant) {
  if (!el) return;
  el.innerHTML = '<div class="mod-bar ' + (variant || '') + '">' + modules.map(function(m) {
    var r = m.get() || {};
    var tone = r.tone || '';
    // A metric worth acting on becomes a button rather than a readout.
    var tag = r.act ? 'button' : 'div';
    var help = (m.help || m.k) + (r.sub ? ' — ' + r.sub : '');
    return '<' + tag + ' class="mod-slot ' + tone + (r.act ? ' act' : '') + '" title="' + help + '"' +
      (r.act ? ' onclick="' + r.act + '"' : '') + '>' +
      '<span class="mod-k">' + m.k + '</span>' +
      '<span class="mod-v ' + tone + '">' + r.v + '</span>' +
      (r.sub ? '<span class="mod-sub">' + r.sub + '</span>' : '') +
    '</' + tag + '>';
  }).join('') + '</div>';
}
function alertCount(modules) {
  return modules.filter(function(m) {
    var t = (m.get() || {}).tone;
    return t === 'warn' || t === 'bad';
  }).length;
}

// â•â•â• INTEL — OVERVIEW â•â•â•
// A turn-based commander needs "what should I do", not "what happened".
// Every entry below is a condition worth acting on, and every one is a
// button that takes you to the thing it is talking about.
function damagedUnits() { return UNITS.filter(function(u) { return u.hp_percent < cfg('thresholds','damagedHp'); }); }
function idleUnits()    { return UNITS.filter(function(u) { return u.is_idle; }); }

function selectUnits(list, why) {
  selected.clear();
  list.forEach(function(u) { selected.add(u.actor_id); });
  lastClickIdx = -1;
  showPanel('left', 'units');
  renderUnits(); updateToolbar();
  showToast(list.length + ' ' + why + ' selected');
}
function selectIdle()    { selectUnits(idleUnits(), 'idle units'); }
function selectDamaged() { selectUnits(damagedUnits(), 'damaged units'); }
function goProduction(sub) { showPanel('left', 'production'); switchTab('prod', sub); }
function goCapacity() { showPanel('left', 'cap'); }
function goTracks() { showPanel('right', 'intel'); switchTab('intel', 'tracks'); }

// Each item: {tone, label, detail, count, act}. Order is severity.
function attentionItems() {
  var out = [];
  var idle = idleUnits(), hurt = damagedUnits();
  var newContacts = ISR_CONTACTS.filter(function(c) { return !c.is_destroyed && c.turns_since_seen === 0; });
  var idleFacs = producingBuildings().filter(function(b) { return b.is_powered && !b.is_producing; });
  var head = ECONOMY.power_provided - ECONOMY.power_drained;

  if (idle.length) out.push({
    tone: idle.length > UNITS.length * cfg('thresholds','idleShare') ? 'bad' : 'warn',
    icon:'idle', label:'Idle units', detail:'Standing by with no orders',
    count: idle.length + '/' + UNITS.length, act:'selectIdle()',
  });
  if (hurt.length) out.push({
    tone:'warn', icon:'damaged', label:'Damaged units', detail:'Below ' + Math.round(cfg('thresholds','damagedHp')*100) + '% health — consider withdrawing',
    count:String(hurt.length), act:'selectDamaged()',
  });
  if (idleFacs.length) out.push({
    tone:'warn', icon:'factory', label:'Idle facilities', detail:'Producing nothing this turn',
    count:String(idleFacs.length), act:"goProduction('fac')",
  });
  if (ECONOMY.harvester_count < cfg('thresholds','minHarvesters')) out.push({
    tone:'warn', icon:'harvest', label:'Thin on harvesters', detail:'Income is one loss away from stalling',
    count:String(ECONOMY.harvester_count), act:'goCapacity()',
  });
  if (head < cfg('thresholds','powerMargin')) out.push({
    tone: head < 0 ? 'bad' : 'warn', icon:'power', label:'Power margin low', detail:'New structures may brown out',
    count:(head >= 0 ? '+' : '') + head, act:'goCapacity()',
  });
  if (newContacts.length) out.push({
    tone:'', icon:'contact', label:'New contacts', detail:'Seen this turn', count:String(newContacts.length), act:'goTracks()',
  });
  if (!orders.length) out.push({
    tone:'bad', icon:'orders', label:'No orders queued', detail:'Committing now would waste the turn', count:'0', act:'',
  });
  return out;
}

function renderAlerts() {
  var el = document.getElementById('alerts-body');
  if (!el) return;
  var items = attentionItems();

  var html = '<div class="grp-label sticky">Needs Attention' +
    '<span class="ct-pill' + (items.length ? '' : ' dim') + '">' + items.length + '</span></div>';

  html += items.length ? items.map(function(a) {
    var tag = a.act ? 'button' : 'div';
    return '<' + tag + ' class="lrow ico att-row"' + (a.act ? ' onclick="' + a.act + '"' : '') + '>' +
      '<div class="lrow-pip ' + a.tone + '"></div>' +
      '<div class="lrow-icon">' + glyph(ALERT_ICON[a.icon]) + '</div>' +
      '<div class="lrow-body"><div class="lrow-title">' + a.label + '</div>' +
        '<div class="lrow-meta"><span>' + a.detail + '</span></div></div>' +
      '<div class="lrow-trail ' + a.tone + '">' + a.count + '</div>' +
    '</' + tag + '>';
  }).join('') : '<div class="list-empty">Nothing needs your attention.</div>';
  el.innerHTML = html;
}

// Force is about us; Intel is about them. Keeping both under one
// "Overview" was what made that tab unable to grow.
function renderForce() {
  var el = document.getElementById('force-body');
  if (!el) return;
  el.innerHTML = '<div class="grp-label sticky">Standing Force</div>';
  var force = document.createElement('div');
  renderModBar(force, [
    {k:'Army Value', get:function() { return {v:'$' + MILITARY.army_value.toLocaleString()}; }},
    {k:'Kills / Lost', get:function() { return {v:MILITARY.units_killed + ' / ' + MILITARY.units_lost, tone: MILITARY.units_killed >= MILITARY.units_lost ? 'ok' : 'warn'}; }},
    {k:'Readiness', get:function() {
      var hp = UNITS.length ? Math.round(UNITS.reduce(function(s,u){ return s + u.hp_percent; }, 0) / UNITS.length * 100) : 0;
      return {v:hp + '%', tone: hp > 70 ? 'ok' : hp > 40 ? 'warn' : 'bad'};
    }},
  ]);
  el.appendChild(force.firstChild);

  // Lines of effort. Full names, a stated scale, and one colour — the
  // old threshold colouring made an amber 65 look heavier than a green
  // 78, so the bars read as unsorted even though they were exact.
  var loe = '<div class="grp-label">Lines of Effort' +
    '<span class="grp-note">0&ndash;100, higher is better</span></div><div class="loe-wrap">';
  PERF_SCORE.dimensions.forEach(function(d) {
    var pct = Math.round(d.value * 100);
    var tr = Math.round(d.trend * 100);
    loe += '<div class="loe-row" title="' + DIM_HELP[d.name] + '">' +
      '<span class="loe-label">' + d.name.charAt(0).toUpperCase() + d.name.slice(1) + '</span>' +
      '<div class="loe-track"><div class="loe-fill" style="width:' + pct + '%"></div></div>' +
      '<span class="loe-val">' + pct + '</span>' +
      '<span class="loe-trend ' + (tr > 0 ? 'up' : tr < 0 ? 'down' : '') + '">' +
        (tr > 0 ? '▲' + tr : tr < 0 ? '▼' + Math.abs(tr) : '·') + '</span>' +
    '</div>';
  });
  loe += '</div>';
  el.insertAdjacentHTML('beforeend', loe);
}

// â•â•â• RIGHT PANEL — ISR CONTACTS â•â•â•
function filterContacts(f) {
  contactFilter = f;
  document.querySelectorAll('#isr-filters .filter-chip').forEach(function(b) { b.classList.toggle('active', b.dataset.cf === f); });
  renderContacts();
}
function renderContacts() {
  var list = document.getElementById('isr-contact-list');
  var INTEL_LABELS = ['PENDING','DETECTED','TRACKED','CLASSIFIED','IDENTIFIED'];
  var active = ISR_CONTACTS.filter(function(c) { return !c.is_destroyed; });
  if (contactFilter !== 'all') active = active.filter(function(c) { return c.category === contactFilter; });

  list.innerHTML = active.length ? active.map(function(c) {
    // Pip carries intel level; confidence decay dims it as the track ages.
    var conf = contactConfidence(c);
    var tone = c.intel_level >= 4 ? 'bad' : c.intel_level >= 2 ? 'warn' : '';
    var stale = c.turns_since_seen > cfg('thresholds','staleContact');
    var pipCls = 'lrow-pip ' + tone + (stale || conf < 0.4 ? ' dim' : '');
    var meta = '<span>' + c.contact_id + '</span><span>' + (INTEL_LABELS[c.intel_level] || '?') + '</span>' +
      (c.hp_percent > 0 ? '<span>HP ' + Math.round(c.hp_percent * 100) + '%</span>' : '') +
      (c.turns_since_seen > 0 ? '<span class="warn">T-' + c.turns_since_seen + '</span>' : '');
    var ic = c.unit_type && ITEM_ICON[c.unit_type] ? ITEM_ICON[c.unit_type] : UNKNOWN_ICON;
    return '<div class="lrow ico">' +
      '<div class="' + pipCls + '"></div>' +
      '<div class="lrow-icon">' + glyph(ic) + '</div>' +
      '<div class="lrow-body"><div class="lrow-title">' + contactName(c) + '</div>' +
        '<div class="lrow-meta">' + meta + '</div></div>' +

}

// â•â•â• RIGHT PANEL — CNN ANALYSIS â•â•â•
function renderCNN() {
  var el = document.getElementById('cnn-body');
  var html = '';

  // Hot spots
  if (CNN_DATA.hot_spots.length) {
    html += '<div class="cnn-sub">Threat Hotspots</div>';
    CNN_DATA.hot_spots.forEach(function(h, i) {
      var pct = Math.round(h.score * 100);
      html += '<div class="cnn-row">' +
        '<span class="cnn-rank">#' + (i+1) + '</span>' +
        '<span class="cnn-label">(' + h.x + ',' + h.y + ') ' + h.contributing_factors.join(', ') + '</span>' +
        '<span class="cnn-score" style="color:var(--red)">' + pct + '</span>' +
        '<div class="cnn-bar"><div class="cnn-fill" style="width:' + pct + '%;background:var(--red)"></div></div>' +
      '</div>';
    });
  }

  // Attack priorities (up to 15 from TacticalAnalysis)
  if (CNN_DATA.attack_priorities.length) {
    html += '<div class="cnn-sub">Attack Priorities</div>';
    CNN_DATA.attack_priorities.forEach(function(a, i) {
      var pct = Math.round(a.score * 100);
      var riskPct = Math.round(a.risk * 100);
      html += '<div class="cnn-row">' +
        '<span class="cnn-rank">#' + (i+1) + '</span>' +
        '<span class="cnn-label">(' + a.x + ',' + a.y + ') ' + a.target_type + '</span>' +
        '<span class="cnn-score" style="color:var(--amber)">' + pct + '</span>' +
        '<div class="cnn-bar"><div class="cnn-fill" style="width:' + pct + '%;background:var(--amber)"></div></div>' +
      '</div>';
    });
  }

  // Defensive positions (up to 20 from TacticalAnalysis)
  if (CNN_DATA.defensive_positions.length) {
    html += '<div class="cnn-sub">Defensive Positions</div>';
    CNN_DATA.defensive_positions.forEach(function(d, i) {
      var pct = Math.round(d.score * 100);
      html += '<div class="cnn-row">' +
        '<span class="cnn-rank">#' + (i+1) + '</span>' +
        '<span class="cnn-label">(' + d.x + ',' + d.y + ') cov:' + Math.round(d.coverage*100) + ' vul:' + Math.round(d.vulnerability*100) + '</span>' +
        '<span class="cnn-score" style="color:var(--green)">' + pct + '</span>' +
        '<div class="cnn-bar"><div class="cnn-fill" style="width:' + pct + '%;background:var(--green)"></div></div>' +
      '</div>';
    });
  }

  // Rally point
  if (CNN_DATA.recommended_rally_point) {
    var rp = CNN_DATA.recommended_rally_point;
    html += '<div style="margin-top:4px;font-size:9px;color:var(--t3)">Rally Point: <span style="font-family:var(--mono);color:var(--accent-text)">(' + rp[0] + ',' + rp[1] + ')</span></div>';
  }

  el.innerHTML = html;
}

function glyph(d) {
  return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" ' +
    'stroke-linejoin="round" stroke-linecap="round">' + (d ? '<path d="' + d + '"/>' : '') + '</svg>';
}

function catalogFor(c) {
  return Object.keys(c.db).filter(function(k) { return c.db[k].queue === c.key; });
}
// Groups a queue's items by role, preserving DB order so roles appear
// in the order they were declared rather than alphabetically.
function rolesFor(cat, keys) {
  var order = [], byRole = {};
  keys.forEach(function(k) {
    var role = cat.db[k].role || 'Other';
    if (!byRole[role]) { byRole[role] = []; order.push(role); }
    byRole[role].push(k);
  });
  return order.map(function(r) { return {role:r, items:byRole[r]}; });
}

// What the base can actually produce right now, from the can_produce
// lists of powered BuildingInfoModel structures. Maps item -> facility.
function producibleSet() {
  var s = {};
  BUILDINGS.forEach(function(b) {
    if (!b.is_powered) return;
    (b.can_produce || []).forEach(function(k) { s[k] = b.type; });
  });
  return s;
}

function searchBuild(q) { buildSearch = q.toLowerCase(); renderBuildView(); }

function renderBuildView() {
  var producible = producibleSet();

  var chips = document.getElementById('build-cats');
  chips.innerHTML = ['<button class="filter-chip icon' + (buildFilter === 'all' ? ' active' : '') +
      '" data-bc="all" title="Everything">' + glyph(CAT_ICON.all) + '</button>']
    .concat(BUILD_CATS.map(function(c) {
      return '<button class="filter-chip icon' + (buildFilter === c.key ? ' active' : '') +
        '" data-bc="' + c.key + '" title="' + c.label + '">' + glyph(CAT_ICON[c.key]) + '</button>';
    })).join('');
  chips.querySelectorAll('.filter-chip').forEach(function(b) {
    b.onclick = function() { buildFilter = b.dataset.bc; buildRole = 'all'; renderBuildView(); };
  });

  var shown = BUILD_CATS.filter(function(c) { return buildFilter === 'all' || buildFilter === c.key; });

  function itemsIn(cat) {
    return catalogFor(cat).filter(function(k) {
      if (!buildSearch) return true;
      return cat.db[k].name.toLowerCase().indexOf(buildSearch) !== -1 || k.indexOf(buildSearch) !== -1;
    });
  }

  // Second tier appears only once a queue is chosen — across all queues
  // the role names collide (Support exists in three), so it would not
  // mean anything. Progressive disclosure keeps the band off screen
  // until it can do real work.
  var roleBar = document.getElementById('build-roles');
  if (shown.length === 1) {
    var groups = rolesFor(shown[0], itemsIn(shown[0]));
    roleBar.style.display = 'flex';
    roleBar.innerHTML = ['<button class="filter-chip' + (buildRole === 'all' ? ' active' : '') + '" data-br="all">All</button>']
      .concat(groups.map(function(g) {
        return '<button class="filter-chip' + (buildRole === g.role ? ' active' : '') + '" data-br="' + g.role +
          '" title="' + g.role + '">' + g.role + '</button>';
      })).join('');
    roleBar.querySelectorAll('.filter-chip').forEach(function(b) {
      b.onclick = function() { buildRole = b.dataset.br; renderBuildView(); };
    });
  } else {
    roleBar.style.display = 'none';
    roleBar.innerHTML = '';
  }

  // Affordability is the primary state: what you can buy right now reads
  // normally, what you cannot is marked at the price. A locked row says
  // which building would unlock it rather than just going grey.
  function itemRow(cat, key) {
    var info = cat.db[key];
    var facility = producible[key];
    var poor = !!facility && info.cost > ECONOMY.cash;
    var cls = 'build-row' + (facility ? (poor ? ' poor' : ' ready') : ' locked');
    var need = facility ? null : requiredFor(key);
    var tip = info.name + ' · ' + info.role + ' · $' + info.cost.toLocaleString() + (facility
      ? ' · built at ' + (BUILDING_DB[facility] ? BUILDING_DB[facility].name : facility) +
        (poor ? ' · costs $' + (info.cost - ECONOMY.cash).toLocaleString() + ' more than you have' : '')
      : (need && need.length ? ' · needs ' + need.join(' or ') : ' · deploy an MCV to place one'));
    // The trailing cell holds one fact, not two: a price when the item
    // is buildable, otherwise the prerequisite. A locked item's price is
    // not the actionable part, so the requirement takes the slot rather
    // than running past the panel edge.
    var needKey = facility ? null : Object.keys(PRODUCED_BY).filter(function(bk) {
      return PRODUCED_BY[bk].indexOf(key) !== -1;
    })[0];
    var trail = facility
      ? '<span class="build-cost' + (poor ? ' warn' : '') + '">$' + info.cost.toLocaleString() + '</span>'
      : '<span class="build-need">' + (needKey ? needKey.toUpperCase() : 'MCV') + '</span>';
    return '<button class="' + cls + '"' + (facility ? '' : ' disabled') +
      ' onclick="queueProd(\'' + cat.action + '\',\'' + key + '\')" title="' + tip + '">' +
      '<span class="build-role" title="' + info.role + '">' + glyph(ITEM_ICON[key]) + '</span>' +
      '<span class="build-name">' + info.name + '</span>' + trail + '</button>';
  }

  var html = '';
  shown.forEach(function(cat) {
    // Order by role so the leading codes read as blocks; the repetition
    // is what groups them, which is why no header band is needed.
    var groups = rolesFor(cat, itemsIn(cat));
    if (shown.length === 1 && buildRole !== 'all') {
      groups = groups.filter(function(g) { return g.role === buildRole; });
    }
    var items = groups.reduce(function(a, g) { return a.concat(g.items); }, []);
    if (!items.length) return;
    var open = items.filter(function(k) { return producible[k]; }).length;
    html += '<div class="grp-label sticky">' + cat.label +
      '<span class="ct-pill' + (open ? '' : ' dim') + '">' + open + '/' + items.length + '</span></div>';
    html += items.map(function(k) { return itemRow(cat, k); }).join('');
  });

  document.getElementById('build-scroll').innerHTML =
    html || '<div class="list-empty">No matching items.</div>';
}

function queueProd(action, item) {
  var db = action === 'build' ? BUILDING_DB : UNIT_DB;
  var info = db[item];
  var label = info ? info.name : item.toUpperCase();
  orders.push({type:action, item_type:item, name:label});
  syncQueue(); showToast(label + ' queued'); bounceBadge();
}

// â•â•â• PRODUCTION — FACILITIES â•â•â•
// BuildingInfoModel structures that can produce, and what they're doing.
function producingBuildings() {
  return BUILDINGS.filter(function(b) { return (b.can_produce || []).length > 0; });
}
function idleFacilityCount() {
  return producingBuildings().filter(function(b) { return b.is_powered && !b.is_producing; }).length;
}
function renderFacilities() {
  var el = document.getElementById('fac-list');
  if (!el) return;
  var facs = producingBuildings();

function syncQueue() {
  var cards = document.getElementById('order-cards');
  var empty = document.getElementById('orders-empty');
  var dot = document.getElementById('q-dot');
  var ct = document.getElementById('q-count');
  var btn = document.getElementById('btn-exec');

  ct.textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '') + ' queued';
  btn.disabled = orders.length === 0;
  dot.classList.toggle('has-orders', orders.length > 0);
  updateIndicators();

  if (!orders.length) { cards.innerHTML = ''; empty.style.display = 'flex'; renderAlerts(); return; }
  empty.style.display = 'none';
  cards.innerHTML = orders.map(function(o, i) {
    var desc = '', unitLabel = '', unitNames = '', eta = '';
    var otype = o.type;
    if (otype === 'move') { desc = 'Move to (' + o.target_x + ',' + o.target_y + ')'; eta = '~2 turns'; }
    else if (otype === 'attack_move') { desc = 'Attack-move (' + o.target_x + ',' + o.target_y + ')'; eta = '~1-3 turns'; otype = 'attack'; }
    else if (otype === 'defend') { desc = 'Defend (' + o.target_x + ',' + o.target_y + ')'; eta = 'Ongoing'; }
    else if (otype === 'scout') { desc = 'Recon (' + o.target_x + ',' + o.target_y + ')'; eta = '~2 turns'; }
    else if (otype === 'guard') { desc = 'Guard area (' + o.target_x + ',' + o.target_y + ')'; eta = 'Ongoing'; }
    else if (otype === 'stop') { desc = 'Stop / hold position'; eta = 'Immediate'; otype = 'hold'; }
    else if (otype === 'set_stance') { desc = 'Stance: ' + STANCES[o.stance]; eta = 'Immediate'; otype = 'stance'; }
    else if (o.item_type) { desc = (o.name || o.item_type) + (o.count > 1 ? ' x' + o.count : ''); eta = '~3 turns'; otype = o.type === 'build' ? 'build' : 'train'; }
    if (o.units && o.units.length) {
      unitLabel = o.units.length + ' unit' + (o.units.length > 1 ? 's' : '');
      var names = o.units.slice(0, 2).map(function(uid) {
        var u = UNITS.find(function(u) { return u.actor_id === uid; });
        return u ? unitName(u) + ' #' + u.actor_id : '#' + uid;
      });
      if (o.units.length > 2) names.push('+' + (o.units.length - 2));
      unitNames = names.join(', ');

    return '<div class="order-card">' +
      '<div class="order-stripe ' + otype + '"></div>' +
      '<div class="order-body">' +
        '<span class="order-badge ' + otype + '">' + otype + '</span>' +
        '<div class="order-detail"><div class="order-desc">' + desc + '</div>' +
        '<div class="order-meta">' +
        (unitLabel ? '<span class="order-units">' + unitLabel + '</span>' : '') +
        (eta ? '<span class="order-eta">' + eta + '</span>' : '') +
        '</div>' +
        (unitNames ? '<div class="order-unit-names">' + unitNames + '</div>' : '') +
        '</div>' +
        '<button class="order-rm" onclick="rmOrder(' + i + ')"><svg width="8" height="8" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>' +
      '</div></div>';
  }).join('');
  renderAlerts();
}
