<title>MilSim C2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #111418;
  --surface: #1C2127;
  --raised: #252A31;
  --elevated: #2F343C;
  --border: #383E47;
  --border-subtle: #21262D;
  --accent: #2D72D2;
  --accent-hover: #4C90F0;
  --accent-soft: rgba(45,114,210,0.12);
  --accent-text: #8ABBFF;
  --green: #32A467;
  --green-soft: rgba(50,164,103,0.08);
  --green-dim: #132A1E;
  --amber: #EC9A3C;
  --amber-soft: rgba(236,154,60,0.08);
  --amber-dim: #2A2014;
  --red: #E76A6E;
  --red-soft: rgba(231,106,110,0.06);
  --red-dim: #2A1518;
  --t1: #F6F7F9;
  --t2: #ABB3BF;
  --t3: #5F6B7C;
  --mono: 'IBM Plex Mono', 'SF Mono', 'Consolas', monospace;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --r: 4px;
  --r-lg: 8px;
  --status-h: 36px;
  --cmd-h: 44px;
  --dock-hdr: 28px;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-decel: cubic-bezier(0, 0, 0.2, 1);
  --ease-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-back: cubic-bezier(0.34, 1.3, 0.7, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F7F9; --surface: #FFFFFF; --raised: #EDEFF2; --elevated: #E5E8EB;
    --border: #D3D8DE; --border-subtle: #DCE0E5;
    --accent: #2D72D2; --accent-hover: #215DB0; --accent-soft: rgba(45,114,210,0.08); --accent-text: #2D72D2;
    --green: #238551; --green-soft: rgba(35,133,81,0.06); --green-dim: #E8F5EE;
    --amber: #C87619; --amber-soft: rgba(200,118,25,0.06); --amber-dim: #FDF3E6;
    --red: #CD4246; --red-soft: rgba(205,66,70,0.04); --red-dim: #FDECEC;
    --t1: #1C2127; --t2: #5F6B7C; --t3: #8F99A8;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1C2127; --raised: #252A31; --elevated: #2F343C;
  --border: #383E47; --border-subtle: #21262D;
  --accent: #2D72D2; --accent-hover: #4C90F0; --accent-soft: rgba(45,114,210,0.12); --accent-text: #8ABBFF;
  --green: #32A467; --green-soft: rgba(50,164,103,0.08); --green-dim: #132A1E;
  --amber: #EC9A3C; --amber-soft: rgba(236,154,60,0.08); --amber-dim: #2A2014;
  --red: #E76A6E; --red-soft: rgba(231,106,110,0.06); --red-dim: #2A1518;
  --t1: #F6F7F9; --t2: #ABB3BF; --t3: #5F6B7C;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--t1);
  font-size: 13px; line-height: 1.5; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum", "cv02", "cv03", "cv04";
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ═══ STATUS BAR ═══ */
.status-bar {
  height: var(--status-h); background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0; z-index: 10;
}
.sb-brand { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.sb-sep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }
.sb-spacer { flex: 1; min-width: 8px; }
.sb-badge { padding: 2px 8px; border-radius: 100px; font-family: var(--mono); font-weight: 600; font-size: 10px; }
.sb-turn { background: var(--accent-soft); color: var(--accent-text); }
.sb-phase { text-transform: uppercase; letter-spacing: 0.05em; font-size: 9px; font-weight: 600; }
.sb-phase.planning { background: var(--amber-soft); color: var(--amber); }
.sb-phase.executing { background: var(--green-soft); color: var(--green); }

/* ═══ WORKSPACE — Dock panel grid ═══ */
.workspace {
  flex: 1; display: grid; overflow: hidden;
  grid-template-columns: 220px 1fr 300px;
  grid-template-rows: 1fr 160px;
  grid-template-areas: "left map right" "left feed feed";
}

/* ═══ DOCK PANELS ═══ */
.dock { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
.dock-hdr {
  height: var(--dock-hdr); min-height: var(--dock-hdr);
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; background: var(--raised);
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; flex-shrink: 0;
}
.dock-hdr svg { width: 13px; height: 13px; color: var(--t3); flex-shrink: 0; }
.dock-title {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--t3); flex: 1;
}
.dock-badge {
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  padding: 1px 5px; border-radius: 100px;
  background: var(--accent-soft); color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.dock-badge.empty { background: var(--elevated); color: var(--t3); }
.dock-chevron { transition: transform 200ms var(--ease-decel); }
.dock.collapsed .dock-chevron { transform: rotate(-90deg); }
.dock.collapsed .dock-body { display: none; }
.dock-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* Panel positions */
.dock-left { grid-area: left; border-right: 1px solid var(--border); }
.dock-right { grid-area: right; border-left: 1px solid var(--border); }
.dock-bottom { grid-area: feed; border-top: 1px solid var(--border); }
.map-center { grid-area: map; position: relative; overflow: hidden; background: var(--bg); }

/* ═══ SEARCH INPUT (reused in panels) ═══ */
.dock-search {
  padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.dock-search input {
  width: 100%; padding: 5px 8px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--t1); font-family: var(--sans); font-size: 11px; outline: none;
}
.dock-search input:focus { border-color: var(--accent); }
.dock-search input::placeholder { color: var(--t3); }

/* ═══ MAP ═══ */
#map-canvas { width: 100%; height: 100%; display: block; }
.map-legend {
  position: absolute; bottom: 8px; left: 8px; z-index: 2;
  display: flex; gap: 14px;
  background: rgba(17,20,24,0.78); padding: 5px 12px;
  border-radius: var(--r); border: 1px solid rgba(56,62,71,0.3);
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--t2); letter-spacing: 0.02em; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }

/* ═══ LEFT PANEL: CONTACTS ═══ */
.filter-bar {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 4px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.filter-bar.compact { gap: 3px; }
.filter-bar.compact .filter-chip { padding: 3px 6px; }
.filter-chip {
  padding: 3px 8px; border-radius: 100px;
  border: 1px solid var(--border); background: transparent;
  color: var(--t2); font-family: var(--sans); font-size: 10px; cursor: pointer;
  transition: border-color 100ms var(--ease-decel), color 100ms var(--ease-decel), transform 80ms var(--ease-decel);
}
.filter-chip:hover { border-color: var(--t3); color: var(--t1); }
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ═══ CMD BAR ACTIONS — action buttons in bottom command bar ═══ */
.cmd-bar-actions {
  display: none; align-items: center; gap: 3px; margin-right: 10px;
}
.cmd-bar-actions.visible { display: flex; }
.sel-count {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--accent-text); margin-right: 4px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.act-btn {
  display: flex; align-items: center; gap: 3px;
  padding: 5px 7px; border-radius: var(--r);
  border: 1px solid transparent; background: transparent;
  color: var(--t1); font-family: var(--sans); font-size: 10px; font-weight: 500; cursor: pointer;
  transition: background 100ms var(--ease-decel), transform 80ms var(--ease-decel); white-space: nowrap;
}
.act-btn:hover { background: var(--raised); }
.act-btn:active { transform: scale(0.93); }
.act-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.act-btn svg { width: 14px; height: 14px; stroke-linecap: round; stroke-linejoin: round; }
.act-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
.act-deselect {
  padding: 4px 7px; border-radius: var(--r);
  border: none; background: transparent; color: var(--t3);
  font-family: var(--sans); font-size: 10px; cursor: pointer;
}
.act-deselect:hover { color: var(--t1); background: var(--raised); }

.cmd-inline-bar {
  display: none; align-items: center; gap: 4px;
}
.cmd-inline-bar.open { display: flex; }
.cmd-inline-bar label { font-size: 9px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; flex-shrink: 0; }
.cmd-inline-bar input, .cmd-inline-bar select {
  padding: 4px 6px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--t1); font-family: var(--mono); font-size: 10px; outline: none; width: 48px;
}
.cmd-inline-bar input:focus { border-color: var(--accent); }
.cmd-inline-bar .cmd-go {
  padding: 4px 12px; border-radius: 3px;
  border: none; background: var(--accent); color: #fff;
  font-family: var(--sans); font-size: 10px; font-weight: 600; cursor: pointer; flex-shrink: 0;
}
.cmd-inline-bar .cmd-go:hover { background: var(--accent-hover); }

/* Unit rows */
.scroll-y { overflow-y: auto; flex: 1; min-height: 0; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.unit-row {
  display: grid; grid-template-columns: 16px 1fr 28px 36px;
  align-items: center; gap: 5px; padding: 4px 8px; height: 30px;
  cursor: pointer; user-select: none;
  transition: background 80ms var(--ease-decel);
  box-shadow: inset 2px 0 0 transparent;
}
.unit-row:hover { background: var(--raised); }
.unit-row.selected { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.unit-check {
  width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: transform 120ms var(--ease-spring), border-color 80ms var(--ease-decel), background 80ms var(--ease-decel);
}
.unit-row:hover .unit-check { border-color: var(--t3); }
.unit-row.selected .unit-check { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.unit-check svg { width: 8px; height: 8px; opacity: 0; color: #fff; } .unit-row.selected .unit-check svg { opacity: 1; }
.unit-info { min-width: 0; display: flex; align-items: baseline; gap: 4px; }
.unit-name { font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-id { font-family: var(--mono); font-size: 9px; color: var(--t3); flex-shrink: 0; }
.unit-stance { font-size: 9px; color: var(--t3); text-align: right; font-family: var(--mono); }
.unit-hp-bar { width: 36px; height: 2px; border-radius: 1px; background: var(--elevated); overflow: hidden; }
.unit-hp-fill { height: 100%; border-radius: 1px; }
.hp-ok { background: var(--green); } .hp-warn { background: var(--amber); } .hp-crit { background: var(--red); }

/* ═══ DESIGN SYSTEM: Modular Toolbar ═══
 * A slot strip for metric modules. Slots wrap and share the width, so a
 * module appended to the driving array simply appears — there is no
 * layout to update and no fixed column count to outgrow.
 * Tone vocabulary shared with the list row: ok / warn / bad.
 * Customise: --mod-min (slot min width), --mod-gap.
 */
.mod-bar {
  --mod-min: 84px; --mod-gap: 3px;
  display: flex; flex-wrap: wrap; gap: var(--mod-gap); padding: 8px;
}
.mod-slot {
  flex: 1 1 var(--mod-min); min-width: var(--mod-min);
  background: var(--bg); border: 1px solid var(--border-subtle);
  border-radius: 3px; padding: 5px 7px;
}
.mod-slot.warn { border-color: var(--amber); background: var(--amber-soft); }
.mod-slot.bad { border-color: var(--red); background: var(--red-soft); }
.mod-k { display: block; font-size: 8px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; }
.mod-v { font-family: var(--mono); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mod-v.ok { color: var(--green); } .mod-v.warn { color: var(--amber); } .mod-v.bad { color: var(--red); }
.mod-sub { font-family: var(--mono); font-size: 8px; color: var(--t3); margin-left: 4px; }

/* Inline variant — the same modules laid out as a single-line strip,
 * used by the top menu bar. Slots become label/value pairs on one
 * baseline, divided by hairlines instead of boxed. */
.mod-bar.inline { padding: 0; gap: 0; flex-wrap: nowrap; align-items: center; min-width: 0; overflow: hidden; }
.mod-bar.inline .mod-slot {
  flex: 0 1 auto; min-width: 0; border: none; background: transparent;
  border-radius: 0; padding: 0 10px;
  display: flex; align-items: baseline; gap: 5px; white-space: nowrap;
  border-left: 1px solid var(--border);
}
.mod-bar.inline .mod-slot:first-child { border-left: none; padding-left: 0; }
.mod-bar.inline .mod-k { display: inline; font-size: 9px; letter-spacing: 0.03em; }
.mod-bar.inline .mod-v { font-size: 11px; }
.mod-bar.inline .mod-sub { margin-left: 0; }

/* ═══ DESIGN SYSTEM: List Row ═══
 * The single row used by every scrolling list — ISR tracks, production
 * queues, facilities. Grid: status pip | body (title + meta) | trailing
 * value, with an optional hairline progress bar on the bottom edge so a
 * row can carry progress without growing into a card.
 * Tone vocabulary shared with the toolbar: ok / warn / bad / dim.
 * Customise: --lrow-h (min height), --lrow-trail (trailing column).
 */
.lrow {
  --lrow-h: 32px; --lrow-trail: 44px;
  position: relative;
  display: grid; grid-template-columns: 8px 1fr var(--lrow-trail);
  gap: 6px; align-items: center;
  min-height: var(--lrow-h); padding: 4px 10px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 10px;
}
.lrow:hover { background: var(--raised); }
.lrow-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }
.lrow-pip.ok { background: var(--green); }
.lrow-pip.warn { background: var(--amber); }
.lrow-pip.bad { background: var(--red); }
.lrow-pip.dim { opacity: 0.35; }
.lrow-body { min-width: 0; }
.lrow-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow-meta {
  font-family: var(--mono); font-size: 8px; color: var(--t3);
  display: flex; align-items: center; gap: 5px;
  overflow: hidden; white-space: nowrap;
}
.lrow-meta .warn { color: var(--amber); }
.lrow-tag {
  font-size: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  padding: 0 3px; border-radius: 2px; background: var(--elevated); color: var(--t3); flex-shrink: 0;
}
.lrow-trail { font-family: var(--mono); font-size: 9px; color: var(--t3); text-align: right; font-variant-numeric: tabular-nums; }
.lrow-trail.ok { color: var(--green); }
.lrow-trail.warn { color: var(--amber); }
.lrow-trail.bad { color: var(--red); }
.lrow-prog {
  position: absolute; left: 0; bottom: 0; height: 2px;
  background: var(--green); transition: width 300ms var(--ease-decel);
}
.lrow-prog.warn { background: var(--amber); }
.list-empty { font-size: 10px; color: var(--t3); padding: 12px 10px; }
.contact-filters { display: flex; gap: 3px; padding: 4px 8px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }

/* ═══ CNN TARGET ROWS ═══ */
.cnn-sub { font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--t3); padding: 5px 0 2px; }
.cnn-row { display: flex; align-items: center; gap: 5px; padding: 2px 0; font-size: 10px; }
.cnn-rank { font-family: var(--mono); font-size: 8px; color: var(--t3); width: 14px; flex-shrink: 0; }
.cnn-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cnn-score { font-family: var(--mono); font-size: 9px; font-weight: 600; width: 28px; text-align: right; flex-shrink: 0; }
.cnn-bar { width: 40px; height: 2px; border-radius: 1px; background: var(--elevated); flex-shrink: 0; }
.cnn-fill { height: 100%; border-radius: 1px; }

/* ═══ RIGHT PANEL: CONTEXT — collapsible sections ═══ */
/* Performance dimension bars */
.sitrep-row { display: flex; align-items: center; gap: 6px; font-size: 10px; }
.sitrep-label { color: var(--t3); font-size: 9px; min-width: 65px; flex-shrink: 0; }
.sitrep-val { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--t1); font-variant-numeric: tabular-nums; }
.sitrep-val.g { color: var(--green); } .sitrep-val.r { color: var(--red); }
.sitrep-bar-wrap { flex: 1; height: 2px; border-radius: 1px; background: var(--elevated); overflow: hidden; }
.sitrep-bar { height: 100%; border-radius: 1px; background: var(--green); transition: width 300ms var(--ease-decel); }

/* Order cards */
.order-card {
  display: flex; align-items: stretch;
  background: var(--raised); border-radius: var(--r);
  border: 1px solid var(--border); margin-bottom: 4px;
  overflow: hidden; min-height: 38px;
  animation: card-in 200ms var(--ease-out-expo) both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(-6px) scale(0.97); } }
.order-card:hover { border-color: var(--elevated); }
.order-stripe { width: 2px; flex-shrink: 0; }
.order-stripe.move { background: var(--accent); } .order-stripe.attack { background: var(--red); }
.order-stripe.defend { background: var(--green); } .order-stripe.scout { background: var(--amber); }
.order-stripe.hold { background: var(--t3); } .order-stripe.build { background: var(--green); }
.order-stripe.train { background: var(--accent); } .order-stripe.stance { background: var(--t3); }
.order-body { flex: 1; display: flex; align-items: center; padding: 5px 8px; gap: 6px; min-width: 0; }
.order-badge {
  font-family: var(--mono); font-size: 8px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  padding: 2px 6px; border-radius: 2px; flex-shrink: 0;
}
.order-badge.move { background: var(--accent-soft); color: var(--accent-text); }
.order-badge.attack { background: var(--red-soft); color: var(--red); }
.order-badge.defend { background: var(--green-soft); color: var(--green); }
.order-badge.scout { background: var(--amber-soft); color: var(--amber); }
.order-badge.hold { background: var(--elevated); color: var(--t2); }
.order-badge.build { background: var(--green-soft); color: var(--green); }
.order-badge.train { background: var(--accent-soft); color: var(--accent-text); }
.order-badge.stance { background: var(--elevated); color: var(--t2); }
.order-detail { flex: 1; min-width: 0; }
.order-desc { font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-units { font-family: var(--mono); font-size: 9px; color: var(--t3); }
.order-meta { display: flex; gap: 6px; align-items: center; margin-top: 1px; }
.order-unit-names { font-family: var(--mono); font-size: 9px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.order-eta { font-family: var(--mono); font-size: 8px; color: var(--t3); padding: 1px 4px; border-radius: 2px; background: var(--elevated); }
.order-rm {
  width: 20px; height: 20px; border-radius: 3px;
  border: none; background: transparent; color: var(--t3);
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  opacity: 0;
}
.order-card:hover .order-rm { opacity: 1; }
.order-rm:hover { background: var(--red-soft); color: var(--red); }
.orders-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--t3); gap: 4px; font-size: 11px; padding: 20px;
}
.orders-empty svg { width: 28px; height: 28px; opacity: 0.15; }
.orders-actions {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.orders-actions button {
  padding: 3px 8px; border-radius: var(--r);

/* Toast */

@keyframes badge-pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* ═══ DESIGN SYSTEM: Segmented Control ═══
 * Composable tab-switcher component.
 * Usage: .seg-ctrl > .seg-btn[data-tab] > label + optional .seg-ct
 * Indicator: .seg-ct shows inline count suffix.
 * Attention: .seg-ct.attn adds a dot prefix for "needs action" state.
 * Customise: --seg-h (height), --seg-r (radius), --seg-font (size).
 */
.seg-ctrl {
  --seg-h: 20px; --seg-r: 4px; --seg-font: 9px; --seg-grow: 1.45;
  display: flex; height: var(--seg-h); border-radius: var(--seg-r);
  background: var(--bg); border: 1px solid var(--border);
  overflow: hidden; flex-shrink: 0; flex: 1;
}
/* Weighted segments: the active one claims extra width and displaces
 * its neighbours, so position in the control — not just tint — tells
 * you which tab you are in. Tune the displacement with --seg-grow. */
.seg-btn {
  flex: 1 1 0; border: none; background: transparent;
  color: var(--t3); font-family: var(--sans); font-size: var(--seg-font); font-weight: 600;
  letter-spacing: 0.03em; cursor: pointer; padding: 0 4px;
  transition: flex-grow 260ms var(--ease-emphasized),
              color 100ms var(--ease-decel), background 100ms var(--ease-decel);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  white-space: nowrap; min-width: 0; overflow: hidden;
}
.seg-btn:hover { color: var(--t2); background: rgba(255,255,255,0.03); }
.seg-btn.active { flex-grow: var(--seg-grow); background: var(--accent-soft); color: var(--accent-text); }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
/* Size variant for nested/second-level menus */
.seg-ctrl.sm { --seg-h: 18px; --seg-font: 8px; }
.seg-ctrl.sm .seg-ct { --ct-dot: 3px; }
/* Row wrapper when a control sits in a panel body rather than a header */
.seg-sub {
  display: flex; padding: 5px 8px; flex-shrink: 0;
  border-bottom: 1px solid var(--border-subtle);
}

/* ═══ DESIGN SYSTEM: Inline Count Indicator ═══
 * Composable badge for any tab/segment/header.
 * .seg-ct           — neutral inline count, reduced opacity
 * .seg-ct.attn      — attention state: dot prefix, full opacity, accent tint
 * .seg-ct.empty     — zero state: hidden
 * .seg-ct.bounce    — one-shot pop when the count changes
 * Customise: --ct-font, --ct-dot, --ct-dim, --ct-tone.
 * Works on .seg-btn, .dock-hdr, or standalone.
 */
.seg-ct {
  --ct-font: 7px; --ct-dot: 4px; --ct-dim: 0.55; --ct-tone: currentColor;
  font-family: var(--mono); font-size: var(--ct-font); font-weight: 600;
  color: var(--ct-tone); opacity: var(--ct-dim); font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 2px;
  transition: opacity 100ms var(--ease-decel), color 100ms var(--ease-decel);
}
.seg-btn.active .seg-ct { opacity: 0.9; }
.seg-ct.attn { --ct-tone: var(--accent-text); opacity: 1; }
.seg-ct.attn::before {
  content: ''; width: var(--ct-dot); height: var(--ct-dot); border-radius: 50%;
  background: currentColor; flex-shrink: 0;
}
.seg-ct.empty { display: none; }
.seg-ct.bounce { animation: badge-pop 400ms var(--ease-spring); }

/* ═══ DESIGN SYSTEM: Tab View Container ═══
 * Generic switchable content panel.
 * .tab-view         — hidden by default
 * .tab-view.active  — visible, fills parent
 */
.tab-view { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }
.tab-view.active { display: flex; }

/* ═══ DESIGN SYSTEM: Group Label ═══
 * Section heading used inside any scrolling panel body.
 */
.grp-label {
  font-size: 8px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--t3); margin: 8px 0 4px; padding-bottom: 2px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 5px;
}
.grp-label:first-child { margin-top: 0; }
.ct-pill {
  font-family: var(--mono); font-size: 8px; font-weight: 600;
  padding: 0 4px; border-radius: 100px;
  background: var(--accent-soft); color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.ct-pill.dim { background: var(--elevated); color: var(--t3); }
.grp-note { margin-left: auto; font-family: var(--mono); font-size: 8px; color: var(--t3); text-transform: none; letter-spacing: 0; }

/* Second-level heading inside a group — lighter than .grp-label so the
 * two levels stay legible in a narrow panel. */
.role-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 7px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--t3); opacity: 0.8;
  margin: 6px 0 3px;
}
.role-label::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
.role-ct { font-family: var(--mono); opacity: 0.7; }

/* ═══ BUILD VIEW — catalog grid ═══
 * Columns auto-fill, so the grid reflows with panel width and any
 * number of categories/items from the data can be added without
 * touching layout code.
 */
.build-scroll { flex: 1; overflow-y: auto; padding: 6px 8px; min-height: 0; }
.build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 3px; }
.build-item {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 6px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--raised);
  color: var(--t2); font-family: var(--mono); font-size: 9px;
  cursor: pointer; min-width: 0; overflow: hidden; text-align: left;
  transition: border-color 80ms var(--ease-decel), color 80ms var(--ease-decel), transform 80ms var(--ease-decel);
}
.build-item:hover { border-color: var(--t3); color: var(--t1); }
.build-item:active { transform: scale(0.95); }
.build-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: 500; }
.build-item-cost { font-size: 7px; color: var(--t3); flex-shrink: 0; }
/* No powered facility can produce it — BuildingInfoModel.can_produce */
.build-item.locked { opacity: 0.32; cursor: not-allowed; border-style: dashed; }
.build-item.locked:hover { border-color: var(--border); color: var(--t2); }
.build-item.locked:active { transform: none; }

.build-item.poor { border-color: var(--border-subtle); }

// ═══ DESIGN SYSTEM: indicator primitive ═══
// setIndicator(id, value, attn) — universal count badge writer.
// value 0/null hides the badge; attn raises it to the dot+accent state.
function setIndicator(id, value, attn) {
  var el = document.getElementById(id);
  if (!el) return;
  var n = value || 0;
  el.textContent = n > 99 ? '99+' : String(n);
  el.classList.toggle('empty', n === 0);
  el.classList.toggle('attn', !!attn && n > 0);
}

// Recomputes every segment indicator from state. Single source of truth.
function updateIndicators() {
  var contacts = ISR_CONTACTS.filter(function(c) { return !c.is_destroyed; });
  var threats = contacts.filter(function(c) { return c.is_visible && c.can_attack; });
  var hot = CNN_DATA.hot_spots.filter(function(h) { return h.score >= 0.8; });
  var producible = producibleSet(), buildable = 0;
  BUILD_CATS.forEach(function(c) {
    catalogFor(c).forEach(function(k) { if (producible[k]) buildable++; });
  });

  var idleFacs = idleFacilityCount();
  var capAlerts = alertCount(CAPACITY_MODULES);

  setIndicator('seg-units-ct', selected.size || getVisibleUnits().length, selected.size > 0);
  setIndicator('seg-build-ct', buildable, false);
  setIndicator('seg-orders-ct', orders.length, orders.length > 0);
  // Top-level counts roll up: the number shows scale, attn shows that
  // something inside one of the sub-tabs wants the commander's eye.
  setIndicator('seg-intel-ct', contacts.length, threats.length > 0);
  setIndicator('seg-prod-ct', ACTIVE_PRODUCTION.length, idleFacs > 0 || capAlerts > 0);
  setIndicator('seg-tracks-ct', contacts.length, threats.length > 0);
  setIndicator('seg-cnn-ct', hot.length, hot.length > 0);
  setIndicator('seg-fac-ct', idleFacs, idleFacs > 0);
  setIndicator('seg-queues-ct', ACTIVE_PRODUCTION.length, false);
  setIndicator('seg-cap-ct', capAlerts, capAlerts > 0);
}

// ═══ DESIGN SYSTEM: tab group controller ═══
// One controller drives every segmented menu. A group is a .seg-ctrl
// plus the .tab-view elements sharing its data-group; buttons and views
// pair up on data-tab. Adding a menu anywhere is markup only — the
// delegated listener below picks it up with no new JS.
var TAB_HOOKS = {
  left:  function(k) { if (k === 'build') renderBuildView(); },
  right: function(k) { if (k === 'production') renderProduction(); },
  prod:  function() { renderProduction(); },
  intel: function(k) { if (k === 'over') renderOverview(); },
};
function switchTab(group, key) {
  document.querySelectorAll('.seg-ctrl[data-group="' + group + '"] .seg-btn')
    .forEach(function(b) { b.classList.toggle('active', b.dataset.tab === key); });
  document.querySelectorAll('.tab-view[data-group="' + group + '"]')
    .forEach(function(v) { v.classList.toggle('active', v.dataset.tab === key); });
  if (TAB_HOOKS[group]) TAB_HOOKS[group](key);
}
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.seg-btn');
  if (!btn) return;
  var ctrl = btn.closest('.seg-ctrl');
  if (ctrl && ctrl.dataset.group) switchTab(ctrl.dataset.group, btn.dataset.tab);
});

function getVisibleUnits() {

    if (unitFilter !== 'all' && cat !== unitFilter) return false;

      if (n.indexOf(unitSearch) === -1 && ('#' + u.actor_id).indexOf(unitSearch) === -1 && u.type.indexOf(unitSearch) === -1) return false;
    }
    return true;
  });
}

  visible.forEach(function(u, idx) {
    var el = document.createElement('div');
    el.className = 'unit-row' + (selected.has(u.actor_id) ? ' selected' : '');
    var hp = Math.round(u.hp_percent * 100);
    var hpCls = hp > 70 ? 'hp-ok' : hp > 35 ? 'hp-warn' : 'hp-crit';
    var st = u.stance >= 0 && u.stance < STANCES.length ? STANCES[u.stance] : '?';
    el.innerHTML =
      '<div class="unit-check"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-5"/></svg></div>' +
      '<div class="unit-info"><span class="unit-name">' + unitName(u) + '</span><span class="unit-id">#' + u.actor_id + '</span></div>' +
      '<div class="unit-stance">' + st + '</div>' +
      '<div class="unit-hp-bar"><div class="unit-hp-fill ' + hpCls + '" style="width:' + hp + '%"></div></div>';
    el.addEventListener('click', function(e) {
      if (e.shiftKey && lastClickIdx >= 0) {
        var start = Math.min(lastClickIdx, idx), end = Math.max(lastClickIdx, idx);
        for (var i = start; i <= end; i++) selected.add(visible[i].actor_id);
      } else if (e.ctrlKey || e.metaKey) {
        if (selected.has(u.actor_id)) selected.delete(u.actor_id); else selected.add(u.actor_id);
      } else {
        if (selected.has(u.actor_id) && selected.size === 1) selected.delete(u.actor_id);
        else { selected.clear(); selected.add(u.actor_id); }
      }
      lastClickIdx = idx;
      renderUnits(); updateToolbar();
    });
    list.appendChild(el);
  });
  updateIndicators();
}

function queueStop() {

function queueFromCmd() {
  if (!activeAct) return;
  if (activeAct === 'stance') {
    var stVal = +document.getElementById('cmd-stance').value;
    orders.push({type:'set_stance', units:Array.from(selected), stance:stVal});
  } else {
    var x = +document.getElementById('cmd-x').value, y = +document.getElementById('cmd-y').value;
    if (x < 0 || y < 0) return;
    var actionMap = {move:'move', attack:'attack_move', defend:'defend', scout:'scout', guard:'guard'};
    orders.push({type:actionMap[activeAct] || activeAct, units:Array.from(selected), target_x:x, target_y:y});
  }
  closeCmd(); syncQueue();
  showToast(activeAct.charAt(0).toUpperCase() + activeAct.slice(1) + ' queued'); bounceBadge();
}

// ═══ DESIGN SYSTEM: modular toolbar renderer ═══
// Renders any array of metric modules. A module is {k, get} where get()
// returns {v, sub, tone} — self-contained, so a new metric is one entry
// in the array and nothing else changes.
function renderModBar(el, modules, variant) {
  if (!el) return;
  el.innerHTML = '<div class="mod-bar ' + (variant || '') + '">' + modules.map(function(m) {
    var r = m.get() || {};
    var tone = r.tone || '';
    return '<div class="mod-slot ' + tone + '">' +
      '<span class="mod-k">' + m.k + '</span>' +
      '<span class="mod-v ' + tone + '">' + r.v + '</span>' +
      (r.sub ? '<span class="mod-sub">' + r.sub + '</span>' : '') +
    '</div>';
  }).join('') + '</div>';
}
function alertCount(modules) {
  return modules.filter(function(m) {
    var t = (m.get() || {}).tone;
    return t === 'warn' || t === 'bad';
  }).length;
}

// ═══ BUILD CATALOG ═══
// Categories are the four ProductionInfoModel.queue_type values. Each
// draws its items from a DB by category, so adding a unit to UNIT_DB —
// or a whole new queue type here — shows up in the UI with no layout
// or render changes.
var BUILD_CATS = [
  {key:'Building', label:'Structures', short:'Bld', db:BUILDING_DB, action:'build'},
  {key:'Defense',  label:'Defenses',   short:'Def', db:BUILDING_DB, action:'build'},
  {key:'Infantry', label:'Infantry',   short:'Inf', db:UNIT_DB, action:'train'},
  {key:'Vehicle',  label:'Vehicles',   short:'Veh', db:UNIT_DB, action:'train'},
  {key:'Aircraft', label:'Aircraft',   short:'Air', db:UNIT_DB, action:'train'},
];
function catalogFor(c) {
  return Object.keys(c.db).filter(function(k) { return c.db[k].queue === c.key; });
}
// Groups a queue's items by role, preserving DB order so roles appear
// in the order they were declared rather than alphabetically.
function rolesFor(cat, keys) {
  var order = [], byRole = {};
  keys.forEach(function(k) {
    var role = cat.db[k].role || 'Other';
    if (!byRole[role]) { byRole[role] = []; order.push(role); }
    byRole[role].push(k);
  });
  return order.map(function(r) { return {role:r, items:byRole[r]}; });
}

// What the base can actually produce right now, from the can_produce
// lists of powered BuildingInfoModel structures. Maps item -> facility.
function producibleSet() {
  var s = {};
  BUILDINGS.forEach(function(b) {
    if (!b.is_powered) return;
    (b.can_produce || []).forEach(function(k) { s[k] = b.type; });
  });
  return s;
}

function searchBuild(q) { buildSearch = q.toLowerCase(); renderBuildView(); }

function renderBuildView() {
  var producible = producibleSet();

  var chips = document.getElementById('build-cats');
  chips.innerHTML = ['<button class="filter-chip' + (buildFilter === 'all' ? ' active' : '') + '" data-bc="all">All</button>']
    .concat(BUILD_CATS.map(function(c) {
      return '<button class="filter-chip' + (buildFilter === c.key ? ' active' : '') + '" data-bc="' + c.key + '">' + c.short + '</button>';
    })).join('');
  chips.querySelectorAll('.filter-chip').forEach(function(b) {
    b.onclick = function() { buildFilter = b.dataset.bc; renderBuildView(); };
  });

  var el = document.getElementById('build-scroll');
  var shown = BUILD_CATS.filter(function(c) { return buildFilter === 'all' || buildFilter === c.key; });
  var html = '';

  function itemBtn(cat, key) {
    var info = cat.db[key];
    var facility = producible[key];
    var poor = !!facility && info.cost > ECONOMY.cash;
    var cls = 'build-item' + (facility ? (poor ? ' poor' : '') : ' locked');
    var tip = facility
      ? info.name + ' — $' + info.cost + ' from ' + (BUILDING_DB[facility] ? BUILDING_DB[facility].name : facility) + (poor ? ' (insufficient cash)' : '')
      : info.name + ' — no powered facility can produce this';
    return '<button class="' + cls + '"' + (facility ? '' : ' disabled') +
      ' onclick="queueProd(\'' + cat.action + '\',\'' + key + '\')" title="' + tip + '">' +
      '<span class="build-item-name">' + info.name + '</span>' +
      '<span class="build-item-cost">$' + info.cost + '</span></button>';
  }

  shown.forEach(function(cat) {
    var items = catalogFor(cat).filter(function(k) {
      if (!buildSearch) return true;
      return cat.db[k].name.toLowerCase().indexOf(buildSearch) !== -1 || k.indexOf(buildSearch) !== -1;
    });
    if (!items.length) return;
    var open = items.filter(function(k) { return producible[k]; }).length;
    html += '<div class="grp-label">' + cat.label +
      '<span class="ct-pill' + (open ? '' : ' dim') + '">' + open + '/' + items.length + '</span></div>';
    // Within a queue, group by doctrinal role.
    rolesFor(cat, items).forEach(function(g) {
      html += '<div class="role-label">' + g.role + ' <span class="role-ct">' + g.items.length + '</span></div>';
      html += '<div class="build-grid">' + g.items.map(function(k) { return itemBtn(cat, k); }).join('') + '</div>';
    });
  });

  el.innerHTML = html || '<div class="list-empty">No matching items.</div>';
}

function queueProd(action, item) {
  var db = action === 'build' ? BUILDING_DB : UNIT_DB;
  var info = db[item];
  var label = info ? info.name : item.toUpperCase();
  orders.push({type:action, item_type:item, name:label});
  syncQueue(); showToast(label + ' queued'); bounceBadge();
}

// ═══ PRODUCTION — FACILITIES ═══
// BuildingInfoModel structures that can produce, and what they're doing.
function producingBuildings() {
  return BUILDINGS.filter(function(b) { return (b.can_produce || []).length > 0; });
}
function idleFacilityCount() {
  return producingBuildings().filter(function(b) { return b.is_powered && !b.is_producing; }).length;
}
function renderFacilities() {
  var el = document.getElementById('fac-list');
  if (!el) return;
  var facs = producingBuildings();
  el.innerHTML = facs.length ? facs.map(function(b) {
    var info = BUILDING_DB[b.type];
    var name = info ? info.name : b.type.toUpperCase();
    var tone, trail, meta, prog = 0;
    if (!b.is_powered) {
      tone = 'bad'; trail = 'Offline';
      meta = '<span>#' + b.actor_id + '</span><span class="warn">no power</span>';
    } else if (b.is_producing) {
      var pi = UNIT_DB[b.producing_item] || BUILDING_DB[b.producing_item];
      prog = Math.round(b.production_progress * 100);
      tone = 'ok'; trail = prog + '%';
      meta = '<span>#' + b.actor_id + '</span><span>' + (pi ? pi.name : b.producing_item) + '</span>';
    } else {
      tone = 'warn'; trail = 'Idle';
      meta = '<span>#' + b.actor_id + '</span><span>' + b.can_produce.length + ' available</span>';
    }
    return '<div class="lrow">' +
      '<div class="lrow-pip ' + tone + '"></div>' +
      '<div class="lrow-body"><div class="lrow-title">' + name + '</div>' +
        '<div class="lrow-meta">' + meta + '</div></div>' +
      '<div class="lrow-trail ' + tone + '">' + trail + '</div>' +
      (prog ? '<div class="lrow-prog" style="width:' + prog + '%"></div>' : '') +
    '</div>';
  }).join('') : '<div class="list-empty">No production facilities.</div>';
}

// ═══ PRODUCTION — QUEUES ═══
// ProductionInfoModel entries. OpenRA ticks at 25/sec.
function renderQueues() {
  var el = document.getElementById('queue-list');
  if (!el) return;
  el.innerHTML = ACTIVE_PRODUCTION.length ? ACTIVE_PRODUCTION.map(function(p) {

    '</div>';

// ═══ PRODUCTION — CAPACITY ═══
// The means of production, as toolbar modules. Append an entry and it
// appears — this is the slot for anything that needs a home later.
var CAPACITY_MODULES = [
  {k:'Cash', get:function() {
    return {v:'$' + ECONOMY.cash.toLocaleString(), tone: ECONOMY.cash < 500 ? 'warn' : 'ok'};
  }},
  {k:'Power', get:function() {
    var head = ECONOMY.power_provided - ECONOMY.power_drained;
    return {
      v:(head >= 0 ? '+' : '') + head,
      sub: ECONOMY.power_provided + '/' + ECONOMY.power_drained,
      tone: head < 0 ? 'bad' : head < 25 ? 'warn' : 'ok',
    };
  }},
  {k:'Silo', get:function() {
    var pct = ECONOMY.resource_capacity ? Math.round(ECONOMY.ore / ECONOMY.resource_capacity * 100) : 0;

  }},
  {k:'Harvesters', get:function() {
    var n = ECONOMY.harvester_count;

  {k:'Queues', get:function() {

function renderCapacity() {

// ═══ ORDER QUEUE ═══
function syncQueue() {
  var cards = document.getElementById('order-cards');
  var empty = document.getElementById('orders-empty');
  var dot = document.getElementById('q-dot');
  var ct = document.getElementById('q-count');
  var btn = document.getElementById('btn-exec');

  ct.textContent = orders.length + ' order' + (orders.length !== 1 ? 's' : '') + ' queued';
  btn.disabled = orders.length === 0;
  dot.classList.toggle('has-orders', orders.length > 0);
  updateIndicators();

  if (!orders.length) { cards.innerHTML = ''; empty.style.display = 'flex'; renderOverview(); return; }
  empty.style.display = 'none';
  cards.innerHTML = orders.map(function(o, i) {
    var desc = '', unitLabel = '', unitNames = '', eta = '';
    var otype = o.type;
    if (otype === 'move') { desc = 'Move to (' + o.target_x + ',' + o.target_y + ')'; eta = '~2 turns'; }
    else if (otype === 'attack_move') { desc = 'Attack-move (' + o.target_x + ',' + o.target_y + ')'; eta = '~1-3 turns'; otype = 'attack'; }
    else if (otype === 'defend') { desc = 'Defend (' + o.target_x + ',' + o.target_y + ')'; eta = 'Ongoing'; }
    else if (otype === 'scout') { desc = 'Recon (' + o.target_x + ',' + o.target_y + ')'; eta = '~2 turns'; }
    else if (otype === 'guard') { desc = 'Guard area (' + o.target_x + ',' + o.target_y + ')'; eta = 'Ongoing'; }
    else if (otype === 'stop') { desc = 'Stop / hold position'; eta = 'Immediate'; otype = 'hold'; }
    else if (otype === 'set_stance') { desc = 'Stance: ' + STANCES[o.stance]; eta = 'Immediate'; otype = 'stance'; }
    else if (o.item_type) { desc = (o.name || o.item_type) + (o.count > 1 ? ' x' + o.count : ''); eta = '~3 turns'; otype = o.type === 'build' ? 'build' : 'train'; }
    if (o.units && o.units.length) {
      unitLabel = o.units.length + ' unit' + (o.units.length > 1 ? 's' : '');
      var names = o.units.slice(0, 2).map(function(uid) {
        var u = UNITS.find(function(u) { return u.actor_id === uid; });
        return u ? unitName(u) + ' #' + u.actor_id : '#' + uid;
      });
      if (o.units.length > 2) names.push('+' + (o.units.length - 2));
      unitNames = names.join(', ');
    }
    return '<div class="order-card">' +
      '<div class="order-stripe ' + otype + '"></div>' +
      '<div class="order-body">' +
        '<span class="order-badge ' + otype + '">' + otype + '</span>' +
        '<div class="order-detail"><div class="order-desc">' + desc + '</div>' +
        '<div class="order-meta">' +
        (unitLabel ? '<span class="order-units">' + unitLabel + '</span>' : '') +
        (eta ? '<span class="order-eta">' + eta + '</span>' : '') +
        '</div>' +
        (unitNames ? '<div class="order-unit-names">' + unitNames + '</div>' : '') +
        '</div>' +
        '<button class="order-rm" onclick="rmOrder(' + i + ')"><svg width="8" height="8" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>' +
      '</div></div>';
  }).join('');
  renderOverview();
}

function executeTurn() {
  if (!orders.length) return;

  ph.textContent = 'Executing'; ph.className = 'sb-badge sb-phase executing';

// ═══ MAP — procedural terrain, full-bleed canvas ═══
var MAP_W = 108, MAP_H = 50;
function _mh(x, y, s) {
  var n = Math.sin(x * 127.1 + y * 311.7 + s * 73.3) * 43758.5453;
  return n - Math.floor(n);
}
function _mn(x, y, sc, s) {
  var sx = x / sc, sy = y / sc;
  var ix = Math.floor(sx), iy = Math.floor(sy);
  var fx = sx - ix, fy = sy - iy;
  fx *= fx * (3 - 2 * fx); fy *= fy * (3 - 2 * fy);
  return (1-fy)*((1-fx)*_mh(ix,iy,s)+fx*_mh(ix+1,iy,s))+fy*((1-fx)*_mh(ix,iy+1,s)+fx*_mh(ix+1,iy+1,s));
}
function _mfbm(x, y, s) {
  return _mn(x,y,18,s)*0.5 + _mn(x,y,8,s+5)*0.3 + _mn(x,y,4,s+10)*0.2;
}

function buildMapMarkers() {
  var markers = [];
  UNITS.forEach(function(u) {
    markers.push({x:u.cell_x, y:u.cell_y, t:'f', k:'u'});
  });
  BUILDINGS.forEach(function(b) {
    markers.push({x:b.cell_x, y:b.cell_y, t:'f', k:'b'});
  });
  ISR_CONTACTS.forEach(function(c) {
    if (c.is_destroyed) return;
    if (c.category === 'building') markers.push({x:c.cell_x, y:c.cell_y, t:'e', k:'b'});
    else markers.push({x:c.cell_x, y:c.cell_y, t:'e', k:'u'});
  });
  return markers;
}

function renderMap() {
  var canvas = document.getElementById('map-canvas');
  var frame = document.getElementById('map-frame');
  if (!canvas || !frame) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = frame.clientWidth, h = frame.clientHeight;
  if (w < 1 || h < 1) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  var cell = Math.max(w / MAP_W, h / MAP_H);
  var ox = (w - MAP_W * cell) / 2, oy = (h - MAP_H * cell) / 2;
  var startCol = Math.floor(-ox / cell) - 1, endCol = Math.ceil((w - ox) / cell) + 1;
  var startRow = Math.floor(-oy / cell) - 1, endRow = Math.ceil((h - oy) / cell) + 1;

  var cs = getComputedStyle(document.documentElement);
  var cAccent = cs.getPropertyValue('--accent').trim() || '#2D72D2';
  var cAccentT = cs.getPropertyValue('--accent-text').trim() || '#8ABBFF';
  var cRed = cs.getPropertyValue('--red').trim() || '#E76A6E';
  var cAmber = cs.getPropertyValue('--amber').trim() || '#EC9A3C';

  for (var row = startRow; row < endRow; row++) {
    for (var col = startCol; col < endCol; col++) {
      var px = ox + col * cell, py = oy + row * cell;
      var inB = col >= 0 && col < MAP_W && row >= 0 && row < MAP_H;
      var ed = inB ? Math.min(col, MAP_W - 1 - col, row, MAP_H - 1 - row) : -1;
      var elev = _mfbm(col, row, 47), moist = _mfbm(col, row, 89);
      var rc = MAP_H * 0.42 + Math.sin(col * 0.055) * 7 + Math.sin(col * 0.14) * 2.5;
      var rd = Math.abs(row - rc), rw = 1.8 + Math.sin(col * 0.03) * 0.6;
      var r, g, b;
      if (!inB) { var v = 11 + elev * 5; r = Math.round(v + 1); g = Math.round(v); b = Math.round(v - 1); }
      else if (ed < 3) { var v = 16 + ed * 4 + elev * 6; r = Math.round(v + 2); g = Math.round(v); b = Math.round(v - 1); }
      else if (rd < rw && elev < 0.62) { var d = 1 - rd / rw; r = Math.round(10 + d * 5); g = Math.round(20 + d * 10); b = Math.round(35 + d * 18); }
      else if (elev > 0.68 || ed < 6) { var v = 22 + elev * 14 + (ed < 6 ? (ed - 3) * 2 : 0); r = Math.round(v + 3); g = Math.round(v + 1); b = Math.round(v - 2); }
      else if (moist > 0.52 && elev > 0.3) { var sh = 0.7 + elev * 0.35; r = Math.round(14 * sh); g = Math.round(26 * sh); b = Math.round(12 * sh); }
      else { var sh = 0.8 + elev * 0.25; r = Math.round(20 * sh); g = Math.round(30 * sh); b = Math.round(16 * sh); }
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(px, py, cell + 1, cell + 1);
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
  for (var gx = 0; gx <= MAP_W; gx += 10) { var lx = ox + gx * cell; ctx.beginPath(); ctx.moveTo(lx, Math.max(0, oy)); ctx.lineTo(lx, Math.min(h, oy + MAP_H * cell)); ctx.stroke(); }
  for (var gy = 0; gy <= MAP_H; gy += 10) { var ly = oy + gy * cell; ctx.beginPath(); ctx.moveTo(Math.max(0, ox), ly); ctx.lineTo(Math.min(w, ox + MAP_W * cell), ly); ctx.stroke(); }

  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  ctx.strokeRect(ox, oy, MAP_W * cell, MAP_H * cell);

  var fs = Math.max(7, Math.min(10, cell * 0.7));
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = '500 ' + fs + 'px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (var gx = 0; gx < MAP_W; gx += 10) ctx.fillText(gx.toString(), ox + gx * cell + cell / 2, oy + 2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (var gy = 10; gy < MAP_H; gy += 10) ctx.fillText(gy.toString(), ox + 3, oy + gy * cell + cell / 2);

  var sz = Math.max(3.5, cell * 0.32);
  var mapMarkers = buildMapMarkers();
  mapMarkers.forEach(function(u) {
    var cx = ox + u.x * cell + cell / 2, cy = oy + u.y * cell + cell / 2;
    ctx.shadowBlur = 0;
    if (u.t === 'f' && u.k === 'u') {
      ctx.shadowColor = cAccentT; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2);
      ctx.fillStyle = cAccent; ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = cAccentT; ctx.lineWidth = 1; ctx.stroke();
    } else if (u.t === 'f' && u.k === 'b') {
      ctx.shadowColor = cAccentT; ctx.shadowBlur = 4;
      ctx.fillStyle = cAccent; ctx.fillRect(cx - sz, cy - sz, sz * 2, sz * 2);
      ctx.shadowBlur = 0; ctx.strokeStyle = cAccentT; ctx.lineWidth = 1;
      ctx.strokeRect(cx - sz, cy - sz, sz * 2, sz * 2);
    } else if (u.t === 'e' && u.k === 'u') {
      ctx.shadowColor = cRed; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.moveTo(cx, cy - sz); ctx.lineTo(cx + sz, cy);
      ctx.lineTo(cx, cy + sz); ctx.lineTo(cx - sz, cy); ctx.closePath();
      ctx.fillStyle = cRed; ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#FF9194'; ctx.lineWidth = 1; ctx.stroke();
    } else if (u.t === 'e' && u.k === 'b') {
      ctx.shadowColor = cRed; ctx.shadowBlur = 4;
      ctx.fillStyle = '#CD4246'; ctx.fillRect(cx - sz, cy - sz, sz * 2, sz * 2);
      ctx.shadowBlur = 0; ctx.strokeStyle = cRed; ctx.lineWidth = 1;
      ctx.strokeRect(cx - sz, cy - sz, sz * 2, sz * 2);
    }
  });
  ctx.shadowBlur = 0;
}
window.addEventListener('resize', function() { renderMap(); });

// ═══ INIT ═══
