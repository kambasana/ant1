# ============================================================================
# COMBAT RESOLUTION TABLES
# ============================================================================

TerrainModifiers:
  Open:
    CoverBonus: 0
    ConcealmentBonus: 0
    MovementCost: 1.0
  LightVegetation:
    CoverBonus: 10
    ConcealmentBonus: 30
    MovementCost: 1.2
  HeavyForest:
    CoverBonus: 30
    ConcealmentBonus: 60
    MovementCost: 2.0
    MaxVehicleSpeed: 15
  Urban:
    CoverBonus: 50
    ConcealmentBonus: 40
    MovementCost: 1.5
  Fortified:
    CoverBonus: 80
    ConcealmentBonus: 50
    MovementCost: 0            # stationary position
  Trench:
    CoverBonus: 70
    ConcealmentBonus: 20
    MovementCost: 1.3

PostureModifiers:
  Prone:
    HitReduction: 0.6          # 60% harder to hit
    AccuracyBonus: 0.1
    MovementPenalty: 0.3       # 30% speed
  Kneeling:
    HitReduction: 0.3
    AccuracyBonus: 0.05
    MovementPenalty: 0.6
  Standing:
    HitReduction: 0.0
    AccuracyBonus: 0.0
    MovementPenalty: 1.0
  Mounted:
    HitReduction: -0.2         # bigger target in vehicle
    AccuracyBonus: 0.15        # stabilized sights
    MovementPenalty: 1.0

TrainingModifiers:
  Green:
    AccuracyMod: 0.6
    MoraleMod: 0.7
    ReactionTime: 2.0          # multiplier (slower)
    SuppressionResist: 0.5
  Trained:
    AccuracyMod: 1.0
    MoraleMod: 1.0
    ReactionTime: 1.0
    SuppressionResist: 1.0
  Veteran:
    AccuracyMod: 1.2
    MoraleMod: 1.3
    ReactionTime: 0.8
    SuppressionResist: 1.4
  Elite:
    AccuracyMod: 1.5
    MoraleMod: 1.6
    ReactionTime: 0.6
    SuppressionResist: 1.8

WeatherModifiers:
  Clear:
    VisibilityMod: 1.0
    MovementMod: 1.0
    AirOpsMod: 1.0
  Rain:
    VisibilityMod: 0.6
    MovementMod: 0.8
    AirOpsMod: 0.7
    ThermalDegraded: true
  Fog:
    VisibilityMod: 0.2
    MovementMod: 0.9
    AirOpsMod: 0.3
  Snow:
    VisibilityMod: 0.7
    MovementMod: 0.6
    AirOpsMod: 0.8
    ThermalEnhanced: true      # contrast against cold background
  Night:
    VisibilityMod: 0.1
    MovementMod: 0.7
    AirOpsMod: 0.5
    NVGVisibilityMod: 0.6
    ThermalEnhanced: true
