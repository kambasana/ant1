# ============================================================================
# ARMORED VEHICLE UNITS
# ============================================================================

# --- US M1A2 Abrams SEPv3 ---
USM1A2Abrams:
  Inherits: ^ArmorUnit
  Tooltip:
    Name: M1A2 Abrams SEPv3
  MilSimIdentity:
    Echelon: Vehicle
    Faction: BLUFOR
    Designation: "M1A2 Abrams"
  Health:
    HP: 5000
  MilSimMovement:
    Speed: 42
    SpeedRoad: 67
    SpeedCrossCountry: 40
    SpeedUrban: 15
    FuelCapacityGallons: 500
    FuelConsumptionPerKm: 3.8
  MilSimCombat:
    Armor:
      Front: 900              # mm RHAe equivalent
      Side: 400
      Rear: 100
      Top: 80
    ActiveProtection: false    # SEPv3 has Trophy APS option
    Weapons:
      - Id: M256_120mm
        Type: TankGun
        Count: 1
        Range: 4000
        EffectiveRange: 3000
        RateOfFire: 6
        Accuracy: 0.85
        ArmorPenetration: 750  # APFSDS
        AmmoTypes:
          - APFSDS              # anti-armor
          - HEAT                # shaped charge
          - MPAT                # multi-purpose
          - CANISTER            # anti-personnel
      - Id: M240C_Coax
        Type: MediumMachineGun
        Count: 1
        Range: 900
        EffectiveRange: 600
        RateOfFire: 100
        Accuracy: 0.3
        SuppressionBonus: 40
      - Id: M2HB_Commander
        Type: HeavyMachineGun
        Count: 1
        Range: 1800
        EffectiveRange: 1200
        RateOfFire: 40
        Accuracy: 0.25
        ArmorPenetration: 25
  MilSimDetection:
    VisualSignature: 70
    ThermalSignature: 90
    NoiseSignature: 85
    Sensors:
      - Type: Thermal
        Range: 4000
        Accuracy: 0.9
      - Type: Visual
        Range: 3000
        Accuracy: 0.8
  MilSimLogistics:
    MainGunRounds: 42
    CoaxRounds: 10000
    CommanderMGRounds: 1000
    Crew: 4

