# ============================================================================
# ARTILLERY & FIRE SUPPORT UNITS
# ============================================================================

# --- US M777A2 155mm Howitzer ---
USM777:
  Inherits: ^ArtilleryUnit
  Tooltip:
    Name: M777A2 155mm Howitzer (US)
  MilSimIdentity:
    Echelon: Section
    Faction: BLUFOR
    Designation: "M777A2 155mm"
    NATOSymbol: artillery
  Health:
    HP: 1500
  MilSimMovement:
    Speed: 0                   # towed, requires prime mover
    SetupTime: 2               # turns to emplace
    TeardownTime: 1            # turns to displace
  MilSimCombat:
    Weapons:
      - Id: M777_155mm
        Type: Howitzer
        Count: 1
        MinRange: 2000
        Range: 30000           # max range with RAP
        EffectiveRange: 24000  # standard HE
        RateOfFire: 5          # rounds per minute sustained
        MaxROF: 8              # rounds per minute maximum
        Accuracy: 0.7          # CEP-based, improves with adjust fire
        AreaEffect: 50         # lethal radius meters
        AmmoTypes:
          - HE                 # high explosive
          - SMOKE              # screening smoke
          - ILLUM              # illumination
          - ICM                # improved conventional munitions
          - RAP                # rocket-assisted projectile (extended range)
          - EXCALIBUR          # GPS-guided (CEP <2m)
    FireMissions:
      - Type: adjust_fire      # observer adjusts onto target
        Delay: 1               # turns from request to first round
      - Type: fire_for_effect  # full fire mission
        Delay: 2
      - Type: suppression      # sustained suppressive fire
        Delay: 1
        Duration: continuous
      - Type: smoke_screen     # obscure an area
        Delay: 1
      - Type: illumination     # illuminate an area (night)
        Delay: 1
  MilSimDetection:
    VisualSignature: 40
    ThermalSignature: 60       # hot when firing
    NoiseSignature: 100        # extremely loud
    Sensors:
      - Type: Visual
        Range: 1000
        Accuracy: 0.5
  MilSimLogistics:
    HERounds: 100
    SMOKERounds: 20
    ILLUMRounds: 15
    ExcaliburRounds: 6
    Crew: 8

