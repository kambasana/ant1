# ============================================================================
# LOGISTICS & SUPPORT UNITS
# ============================================================================

# --- US HMMWV (Utility) ---
USHMMWV:
  Inherits: ^LogisticsUnit
  Tooltip:
    Name: HMMWV M1151 (US)
  MilSimIdentity:
    Echelon: Vehicle
    Faction: BLUFOR
    Designation: "HMMWV"
    NATOSymbol: wheeled_vehicle
  Health:
    HP: 800
  MilSimMovement:
    Speed: 50
    SpeedRoad: 89
    SpeedCrossCountry: 30
  MilSimCombat:
    Armor:
      Front: 10
      Side: 10
      Rear: 5
      Top: 0
    Weapons:
      - Id: M2HB
        Type: HeavyMachineGun
        Count: 1
        Range: 1800
        EffectiveRange: 1200
  MilSimLogistics:
    IsSupplyUnit: false
    CargoCapacity: 50
    PassengerCapacity: 4

