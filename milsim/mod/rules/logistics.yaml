# --- Forward Operating Base ---
ForwardOperatingBase:
  Inherits: ^MilSimUnit
  Tooltip:
    Name: Forward Operating Base
  MilSimIdentity:
    Echelon: Installation
    Branch: Logistics
    NATOSymbol: supply_point
  Health:
    HP: 10000
  MilSimMovement:
    Speed: 0                   # fixed installation
  MilSimLogistics:
    IsSupplyUnit: true
    IsDepot: true
    StorageCapacity: 5000
    ResupplyRate: 200          # SP generated per turn from higher
    CanResupply:
      - Ammunition
      - Fuel
      - Water
      - Food
      - Medical
  MilSimDetection:
    VisualSignature: 90
    ThermalSignature: 70
    NoiseSignature: 50

# --- Supply Route Definition ---
# Supply routes are defined on the map, not as units.
# These rules govern route behavior.
SupplyRouteRules:
  MSR:                         # Main Supply Route
    DisplayName: Main Supply Route
    ConvoySpeedMultiplier: 1.0
    Capacity: 3                # convoys per turn
    Priority: primary
  ASR:                         # Alternate Supply Route
    DisplayName: Alternate Supply Route
    ConvoySpeedMultiplier: 0.8
    Capacity: 2
    Priority: alternate
  Interdiction:
    ConvoyLossChance: 0.3      # chance per convoy when route under fire
    ConvoyDelayTurns: 2        # delay when route is contested
    RouteClosedThreshold: 3    # enemy units within X km closes route

