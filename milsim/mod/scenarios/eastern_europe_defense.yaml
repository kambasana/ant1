Scenario:
  Name: "Suwalki Gap — NATO Forward Defense"
  Description: >
    A Russian Battalion Tactical Group (BTG) has crossed the Lithuanian
    border in a surprise offensive to link Kaliningrad with Belarus via
    the Suwalki Gap — NATO's most vulnerable corridor. A US mechanized
    infantry company, part of the NATO Enhanced Forward Presence, must
    delay the Russian advance until brigade reinforcements arrive.
    Based on real-world NATO contingency planning for the Suwalki Corridor.
  Scale: company
  TrainingObjectives:
    - "Execute a delay operation against a numerically superior force"
    - "Fight successive positions and manage disengagement"
    - "Coordinate with coalition partners and joint fires"
    - "Manage logistics in a contested environment with limited resupply"
  Terrain: >
    Lithuanian-Polish border — rolling farmland, scattered forests,
    small villages, road network connecting Kaliningrad to Grodno.
    The Suwalki Gap is 100km of open terrain between Kaliningrad and Belarus.
  Weather: Overcast, 5C, rain expected Turn 8
  TimeOfDay: "0300"
  Duration: 24
  TurnDuration: 30

  Situation:
    General: >
      At 0200Z, Russian forces launched a multi-axis offensive from
      Kaliningrad and Belarus. EW jamming is degrading communications.
      NATO Article 5 has been invoked. Brigade is mobilizing from Germany
      but earliest reinforcement is 12 hours (Turn 24). Your company
      is the forward screening force — you must delay, not defeat, the enemy.
    Enemy:
      Composition: >
        Russian BTG from 11th Army Corps (Kaliningrad): 1x Motor Rifle
        Company (BMP-3), 1x Tank Company (T-90M), 1x Artillery Battery
        (2S19 Msta-S), 1x Mortar Battery (2B11), 1x Recon Platoon,
        AT platoon (Kornet), EW section. Estimated 800 personnel.
      Disposition: >
        Recon elements already across the border. Main body 10km east,
        advancing on two axes: Route NORTH (main road) and Route SOUTH
        (secondary road). Artillery in march column behind main body.
        EW jamming active — comms degraded.
      MostLikelyCOA: >
        Recon pull — recon finds gaps, main body exploits. Artillery
        prep on identified positions. Tank company leads on Route NORTH,
        motor rifle company on Route SOUTH. Standard Russian echeloned
        attack doctrine.
      MostDangerousCOA: >
        Bypass company positions entirely using Route SOUTH while fixing
        with fires on Route NORTH. Airborne/air assault element lands
        behind our positions to cut withdrawal routes.
    Friendly:
      HigherMission: >
        NATO EFBP Battlegroup delays Russian advance through the Suwalki
        Gap for 12 hours to enable brigade deployment.
      AdjacentUnits: >
        Lithuanian Territorial Defense platoon covering Route SOUTH (light
        infantry, limited heavy weapons). Polish reconnaissance company
        arriving at T+8 hours. NATO air support limited — Russian IADS active.
      Attachments: >
        1x Tank Platoon (4x M1A2 Abrams), 1x Mortar Section (2x M120),
        1x Javelin team, 1x Engineer squad (obstacles/demolition)
      Detachments: "None"

