  OPFOR:
    Doctrine: russian_combined_arms
    AIBehavior: >
      Execute standard BTG attack. Recon forward, artillery prep on
      identified positions, then combined arms assault. Lead with tanks
      on Route NORTH. Motor rifle on Route SOUTH to fix/flank. If
      stalled, call additional artillery and attempt bypass. Aggressive
      tempo — this is a time-critical operation to link Kaliningrad.
    Units:
      # Recon element (already forward)
      - Type: RUMotorRifleSquad
        Designation: "Recon Squad 1"
        Location: [50, 30]
        Stance: move
        Concealed: true
