Scenario:
  Name: "Urban Clearance — Dense Urban Terrain"
  Description: >
    A mechanized infantry company is tasked with clearing a dense urban
    area suspected of harboring fortified enemy positions. The environment
    includes civilian population, tunnel networks, and IED threats.
    Inspired by contemporary urban warfare in the Middle East. This scenario
    focuses on the extreme complexity of MOUT (Military Operations on
    Urban Terrain) with strict ROE and civilian protection requirements.
  Scale: company
  TrainingObjectives:
    - "Execute methodical urban clearance operations (MOUT)"
    - "Apply proportionality and distinction principles under ROE"
    - "Manage civilian evacuation concurrent with offensive operations"
    - "Counter tunnel and IED threats in urban terrain"
    - "Coordinate between dismounted infantry and armored support in confined spaces"
  Terrain: Dense urban — multi-story buildings, narrow streets, underground tunnels
  Weather: Clear, hot, 38C
  TimeOfDay: "0400"
  Duration: 20
  TurnDuration: 30

  Situation:
    General: >
      Brigade is conducting a phased clearance of a dense urban area.
      Intelligence indicates enemy forces have fortified positions in
      residential buildings, prepared tunnel networks for movement and
      resupply, and emplaced IEDs on major thoroughfares. Significant
      civilian population remains in the area despite evacuation orders.
    Enemy:
      Composition: >
        Estimated 2x reinforced platoons of irregular fighters with
        RPGs, small arms, IEDs, and tunnel access. Supported by sniper
        teams, mortar teams, and ATGM teams positioned in upper floors
        of buildings. Some fighters operate in civilian clothing.
      Disposition: >
        Dispersed in fortified positions throughout the urban area.
        Tunnel entrances in basements connect multiple blocks. IEDs
        on Routes MAIN and CROSS. Sniper team in the hospital tower.
        ATGM team in the apartment complex covering the southern approach.
      MostLikelyCOA: >
        Defend from prepared positions. Use tunnels to reposition after
        contact. Employ IEDs to canalize and attrit. Use civilian
        presence to complicate BLUFOR targeting. Withdraw through
        tunnels if position untenable.
      MostDangerousCOA: >
        Lure BLUFOR into close urban engagement, then collapse building
        with pre-placed demolitions. Execute complex ambush using tunnels
        to appear behind clearing forces.
    Friendly:
      HigherMission: "Brigade clears urban area in phases from south to north"
      AdjacentUnits: >
        Bravo Company clearing the western sector. Engineers on standby
        for breaching and tunnel operations. Civil Affairs team available
        for civilian handling.
      Attachments: >
        1x Engineer Squad (breaching), 1x Tank Section (2x M1A2),
        1x Scout UAV, 1x Civil Affairs team
      Detachments: "3rd Platoon detached to battalion reserve"

  BLUFOR:
    Units:
      - Type: USRifleSquad
        Designation: "1-1 (1st Squad, 1st Plt)"
        Location: [30, 55]
        Strength: 100
        Stance: move

      - Type: USRifleSquad
        Designation: "1-2 (2nd Squad, 1st Plt)"
        Location: [31, 55]
        Strength: 100
        Stance: move

      - Type: USRifleSquad
        Designation: "1-3 (3rd Squad, 1st Plt)"
        Location: [32, 55]
        Strength: 100
        Stance: move

      - Type: USRifleSquad
        Designation: "2-1 (1st Squad, 2nd Plt)"
        Location: [28, 56]
        Strength: 100
        Stance: move

      - Type: USRifleSquad
        Designation: "2-2 (2nd Squad, 2nd Plt)"
        Location: [29, 56]
        Strength: 100
        Stance: move

      - Type: USRifleSquad
        Designation: "2-3 (3rd Squad, 2nd Plt)"
        Location: [30, 56]
        Strength: 100
        Stance: move

      - Type: USWeaponsSquad
        Designation: "Weapons Sqd, 1st Plt"
        Location: [33, 55]
        Strength: 100
        Stance: overwatch

      - Type: USM1A2Abrams
        Designation: "Tank 1 (attached)"
        Location: [31, 57]
        Strength: 100
        Stance: overwatch

      - Type: USM1A2Abrams
        Designation: "Tank 2 (attached)"
        Location: [29, 57]
        Strength: 100
        Stance: overwatch

      - Type: USM120Mortar
        Designation: "Mortar Section"
        Location: [30, 60]
        Strength: 100
        Stance: defend

      - Type: USJavelinTeam
        Designation: "Javelin, 2nd Plt"
